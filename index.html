<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ayudas para las Reuniones</title>
<meta name="description" content="Prepara y consulta el contenido de las reuniones, el texto diario y las ilustraciones.">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7b2d8b">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --accent:#7b2d8b; --accent-dark:#5e2170;
  --navy:#1b2a4a; --navy2:#24365e;
  --bg:#f2f3f7; --card:#ffffff; --ink:#1d2433;
  --muted:#66707f; --line:#e3e6ee;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16.5px;line-height:1.55}
header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--navy2),var(--navy));color:#fff;display:flex;align-items:center;gap:4px;padding:10px;box-shadow:0 2px 8px rgba(10,20,40,.25)}
header .ttl{font-weight:700;font-size:16.5px;flex:1;min-width:0;display:flex;align-items:center;gap:8px;cursor:pointer}
header .ttl .ttl-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
header .ttl .home-ic{color:#cfa6e8;flex:none;display:flex;align-items:center}
header .ttl .home-ic svg{width:20px;height:20px;display:block}
header button.icobtn{background:transparent;border:0;color:#fff;font-size:20px;width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;border-radius:10px}
header button.icobtn svg{width:21px;height:21px;display:block}
header button.icobtn:active{background:rgba(255,255,255,.15)}
main{max-width:720px;margin:0 auto;padding:16px 16px 90px}
.hero{background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;border-radius:16px;padding:18px 18px 16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(20,35,70,.18)}
.hero .k{color:#cfa6e8;font-weight:700;letter-spacing:.06em;font-size:13.5px;text-transform:uppercase}
.hero p{margin:6px 0 0;font-size:17px;color:#eef1f8}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 4px;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.tabs button .tic{font-size:21px}
.tabs button.on{border-color:var(--accent);color:var(--ink);background:#fbf7fd}
.tabs button.on .tic{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,35,70,.05)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);padding:16px 14px;font-size:16.5px;font-weight:600;color:var(--ink);cursor:pointer}
.row:last-child{border-bottom:0}
.row .ric{width:38px;height:38px;border-radius:50%;background:#f1e9f6;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.row .arr{margin-left:auto;color:#9aa3b2;font-size:20px;font-weight:400}
.row small{display:block;font-weight:400;color:var(--muted);font-size:13.5px;margin-top:2px}
.thought{padding:16px}
.thought .k{color:var(--muted);font-weight:700;letter-spacing:.05em;font-size:13px;text-transform:uppercase}
.thought .q{font-size:18.5px;font-style:italic;margin:10px 0 8px}
img.cimg{display:block;width:100%;height:auto;border-radius:16px}
figure.cfig{margin:12px 0}
figure.cfig figcaption{font-size:13.5px;color:var(--muted);margin-top:6px}
.jwlink{display:inline-block;padding:9px 16px;border:1.5px solid var(--accent);color:var(--accent);border-radius:999px;font-weight:600;font-size:14.5px;text-decoration:none;background:#fff}
.jwlink:active{background:#f1e9f6}
.imglinks{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.thought img.cimg{margin-bottom:12px}
.ilthumb{width:58px;height:58px;object-fit:cover;border-radius:12px;flex:none}
.newscat{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:1px}
.pensref{font-size:14.5px;color:var(--muted);font-weight:600;margin:0 0 8px}
.penssoft{background:#f7f3fa}
.tag.penswk{background:#e6f4ea;color:#1e7a34}
div[data-pens]{cursor:pointer}
.tag{display:inline-block;background:#e8f0fe;color:#2b5aa6;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}
.foot{color:var(--muted);font-size:13.5px;text-align:center;margin:18px 0 4px}
h1.screen{font-size:23px;line-height:1.3;margin:2px 0 6px}
h2.sec{font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin:20px 0 6px}
h4.subh{font-size:15.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--navy);margin:16px 0 4px}
.chip{display:inline-block;background:#eef0f5;border-radius:999px;padding:3px 11px;font-size:13.5px;color:#45506b;margin:2px 4px 2px 0;font-weight:600}
.meta{margin:6px 0 4px}
.blk{margin:7px 0}
.qline{font-weight:700;margin:14px 0 4px}
.extrabox{background:#f7f3fa;border:1px solid #e6dcf0;border-radius:14px;padding:10px 12px;margin:10px 0}
.extrabox .k{font-weight:700;color:var(--accent-dark);font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.pearl{border-bottom:1px solid var(--line);padding:12px 2px}
.pearl:last-child{border-bottom:0}
.pearl .pref{font-weight:700;font-size:17px}
a.ref{color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px dotted var(--accent);cursor:pointer}
mark.hl{color:inherit;padding:0 .5px;border-radius:2px;cursor:pointer}
.screenbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.screenbar .sp{flex:1}
button.bmk{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14.5px;font-weight:600;cursor:pointer;color:var(--ink)}
button.bmk.on{border-color:var(--accent);color:var(--accent);background:#fbf7fd}
.notebox{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 1px 3px rgba(20,35,70,.05)}
.notebox label{font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.notebox textarea{width:100%;border:0;resize:vertical;min-height:74px;font:inherit;font-size:15.5px;margin-top:6px;outline:none;background:transparent;color:var(--ink)}
.notebox .saved{font-size:12.5px;color:#8a94a6}
textarea.inp, input.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
button.primary{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer;width:100%}
button.primary:active{background:var(--accent-dark)}
.kv{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:2px 14px;margin:10px 0;box-shadow:0 1px 3px rgba(20,35,70,.05)}
.kvrow{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.kvrow:last-child{border-bottom:0}
.kvl{flex:none;width:118px;font-weight:700;color:var(--accent-dark);font-size:13.5px;text-transform:uppercase;letter-spacing:.03em;padding-top:2px}
.kvv{flex:1;font-weight:600}
.wabtn{display:block;text-align:center;background:#25d366;color:#fff;font-weight:700;font-size:16.5px;padding:14px 18px;border-radius:12px;text-decoration:none;margin-top:18px}
.wabtn:active{background:#1eb856}
.swatches{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;cursor:pointer;font-weight:600;font-size:14.5px;color:var(--ink)}
.swatch .dot{width:34px;height:34px;border-radius:50%}
.swatch.on{border-color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
#sheetWrap{position:fixed;inset:0;z-index:60;display:none;pointer-events:none}
#sheetWrap.open{display:block}
#sheetBg{position:absolute;inset:0;background:rgba(10,16,30,.22)}
#vcard{position:absolute;left:50%;top:14%;transform:translateX(-50%);width:min(92vw,440px);max-height:84vh;display:flex;flex-direction:column;background:#fff;border-radius:8px;box-shadow:0 18px 50px rgba(10,16,30,.35),0 4px 14px rgba(10,16,30,.18);overflow:hidden;pointer-events:auto}
#vcard.drag{box-shadow:0 26px 64px rgba(10,16,30,.42),0 6px 18px rgba(10,16,30,.2)}
#vcardHead{background:#4d4d4d;color:#fff;display:flex;align-items:stretch;gap:10px;padding:0 0 0 16px;min-height:50px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;flex:none}
#vcardHead:active{cursor:grabbing}
#vcardHead .vtitle{font-weight:700;font-size:16.5px;flex:1;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#sheetClose{background:#3d3d3d;border:0;color:#fff;width:48px;align-self:stretch;border-radius:0;font-size:17px;line-height:1;cursor:pointer;flex:none}
#sheetClose:active{background:#333}
#vcardBody{padding:16px 18px;overflow:auto}
.vrefrow{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
#sheetRef{color:#2a6ebb;font-weight:800;font-size:21px;line-height:1.3;flex:1;min-width:0}
#sheetText{font-size:17px;line-height:1.55}
#sheetText .vn{font-weight:800;color:#2a6ebb}
.vacts{display:flex;align-items:center;gap:10px;margin-top:14px}
#vaudBtn{background:transparent;border:0;padding:0;cursor:pointer;flex:none}
#vaudBtn[hidden]{display:none}
#vaudBtn .vplay{width:44px;height:44px;border-radius:7px;border:1.5px solid #b7bcc4;background:#fff;display:flex;align-items:center;justify-content:center;color:#4d4d4d;flex:none}
#vaudBtn .vplay svg{width:19px;height:19px;display:block}
#vaudBtn:active .vplay{background:#f0f0f0}
#vcardBody a.wolmini{color:#2a6ebb}
#vcardBody a.wol{background:#2a6ebb}
#sheetLink{margin-left:auto;display:flex}
a.wolmini{color:var(--accent);font-weight:700;text-decoration:none;font-size:15px;white-space:nowrap;padding:6px 2px}
a.wol{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:11px 16px;border-radius:10px}
#sheetSrc{font-size:13px;color:#8a8f9c}
#sheetSrc:not(:empty){margin-top:10px}
#hlact{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 7px;display:none;align-items:center;gap:3px;box-shadow:0 4px 16px rgba(20,30,60,.18);min-height:40px;box-sizing:border-box;touch-action:none}
#hlact.open{display:flex}
#hlpal{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 8px;display:none;align-items:center;gap:5px;box-shadow:0 4px 16px rgba(20,30,60,.18);min-height:40px;box-sizing:border-box;touch-action:none}
#hlpal.open{display:flex}
#hlpal .cdot{width:27px;height:27px;border-radius:50%;border:1px solid rgba(20,30,60,.20);cursor:pointer;padding:0;flex:none}
#hlpal .cdot.on{box-shadow:0 0 0 2px #fff,0 0 0 4.5px rgba(20,30,60,.55)}
.hlcbtn{position:relative;width:44px;height:30px;background:transparent;border:0;cursor:pointer;padding:0;flex:none;border-radius:999px}
.hlcbtn .ovl{position:absolute;top:50%;width:19px;height:19px;border-radius:50%;transform:translateY(-50%)}
.hlcbtn .ovl.b1{left:0}
.hlcbtn .ovl.b2{right:0}
.hlcbtn .ovl.fr{left:50%;width:23px;height:23px;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 1px 4px rgba(20,30,60,.28)}
.hlico{width:34px;height:30px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;color:var(--ink);cursor:pointer;padding:0;flex:none;border-radius:999px;font-size:15px}
.hlico:active{background:#f1e9f6}
::selection{background:rgba(120,120,140,.25)}
::-moz-selection{background:rgba(120,120,140,.25)}
/* Botón «Escuchar» de publicaciones y barra de reproductor (estilo JW.org) */
.listenbtn{display:flex;align-items:center;gap:10px;width:100%;background:var(--navy);color:#fff;border:0;border-radius:14px;padding:13px 16px;font-size:16px;font-weight:700;cursor:pointer;margin:0 0 14px;text-align:left}
.listenbtn svg{width:22px;height:22px;flex:none}
.listenbtn:active{background:var(--navy2)}
#pubbar{position:fixed;left:0;right:0;bottom:0;z-index:65;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(10,20,40,.18);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
#pubbar[hidden]{display:none}
.pb-top{display:flex;align-items:center;gap:10px}
#pbTitle{flex:1;font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pbClose{background:transparent;border:0;font-size:17px;line-height:1;color:var(--muted);cursor:pointer;padding:6px;flex:none}
.pb-controls{display:flex;align-items:center;gap:8px;margin-top:8px}
#pbPlay{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
#pbPlay svg{width:20px;height:20px;display:block}
#pbPlay:disabled{background:#c9cedb;cursor:default}
.pbskip{background:#eef0f5;border:0;border-radius:999px;padding:9px 11px;font-weight:700;font-size:13.5px;color:var(--ink);cursor:pointer;flex:none}
.pbskip:disabled{color:#a6adbb;cursor:default}
.pbtime{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none;min-width:36px;text-align:center}
#pbSeek{flex:1;accent-color:var(--accent);min-width:0}
#pbSeek:disabled{opacity:.4}
#pbMsg{display:none;color:#b03a2e;font-size:13.5px;margin-top:6px}
#pbMsg.show{display:block}
body.pubopen main{padding-bottom:180px}

/* Mejoras: buscador, tamaño de letra, hoy */
.searchbox{margin:0 0 14px}
.searchbox input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font:inherit;font-size:16.5px;background:#fff;color:var(--ink);outline:none}
.searchbox input:focus{border-color:var(--accent)}
.sres{padding:14px}
.sres .k{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.sres .t{font-weight:700;font-size:16px;margin-bottom:4px}
.sres .s{font-size:14.5px;color:var(--muted);line-height:1.45}
.fontbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.fontbtns button{flex:1;min-width:90px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 8px;font-weight:600;cursor:pointer;color:var(--ink)}
.fontbtns button.on{border-color:var(--accent);background:#fbf7fd;color:var(--accent-dark)}


/* Panel para publicar */
.panelbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(20,35,70,.05)}
.panelbox h3{margin:0 0 8px;font-size:16px;color:var(--navy)}
.panellabel{display:block;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:10px 0 4px}
.panelinput, .paneltextarea, .panelselect{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:15.5px;background:#fff;color:var(--ink);outline:none;box-sizing:border-box}
.paneltextarea{min-height:110px;resize:vertical}
.paneltextarea.big{min-height:220px}
.panelselect{appearance:none}
.panelrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.panelbtn{flex:1;min-width:130px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 10px;font-weight:700;cursor:pointer;color:var(--ink);font-size:14.5px}
.panelbtn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.panelbtn.warn{background:#fff;color:#b03a2e;border-color:#e8b4ae}
.panelitem{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:#fbfbfe}
.panelitem .del{float:right;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:13px}
.panelhint{font-size:13.5px;color:var(--muted);line-height:1.45;margin:6px 0}
.panelstatus{font-weight:700;color:var(--accent-dark);font-size:14.5px;min-height:20px;margin-top:8px}


/* Panel v2 tabs + TTS */
.paneltabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.paneltabs button{flex:1 1 110px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;font-weight:700;cursor:pointer;color:var(--muted);font-size:13.5px}
.paneltabs button.on{border-color:var(--accent);color:var(--accent-dark);background:#fbf7fd}
.panel-tab{display:none}
.panel-tab.on{display:block}
.pastebox{background:#f7f3fa;border:1.5px dashed var(--accent);border-radius:14px;padding:12px;margin:10px 0}
.pastebox textarea{min-height:140px}
#ttsbar{position:fixed;left:0;right:0;bottom:0;z-index:66;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(10,20,40,.18);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:none}
#ttsbar.show{display:block}
#ttsbar .tts-top{display:flex;align-items:center;gap:10px}
#ttsTitle{flex:1;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttsbtn{background:var(--accent);color:#fff;border:0;border-radius:999px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ttsbtn.sec{background:#eef0f5;color:var(--ink)}
body.ttsopen main{padding-bottom:170px}

</style>
</head>
<body>
<header>
  <button class="icobtn" id="backBtn" aria-label="Atrás" style="display:none">←</button>
  <div class="ttl" id="ttlHome"><span class="home-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg></span><span class="ttl-txt">Ayudas para las Reuniones</span></div>
  <button class="icobtn" id="searchBtn" aria-label="Buscar" title="Buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></button>
  <button class="icobtn" id="favBtn" aria-label="Favoritos" title="Favoritos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg></button>
  <button class="icobtn" id="setBtn" aria-label="Ajustes" title="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/><circle cx="12" cy="12" r="3"/></svg></button>
</header>
<main id="app"></main>

<div id="sheetWrap">
  <div id="sheetBg"></div>
  <section id="vcard" aria-label="Pasaje bíblico citado">
    <div id="vcardHead">
      <div class="vtitle">Pasaje bíblico citado</div>

    </div>
    <div id="vcardBody">
      <div class="vrefrow">

    <button class="pbskip" id="pbFwd" type="button" aria-label="Adelantar 15 segundos">+15 s</button>

  <div id="pbMsg"></div>
</div>
<audio id="paud" preload="none"></audio>

<div id="hlact"></div>
<div id="hlpal"></div>

<script src="data.js"></script>
<script>
"use strict";
/* ================= Configuración ================= */
const SUPPORT_WHATSAPP_LINK = "https://wa.me/527224248895"; // Enlace de WhatsApp para «Apoyo voluntario» (déjalo vacío para ocultar el botón de contacto).
/* ============ Pensamiento para meditar: rotación semanal ============
   Los 13 pensamientos viven en DATA.pensamientos (orden 1–13). La
   rotación es la de Base44: el lunes 2026-11-23 está activo el Orden 4
   y cada lunes avanza uno, volviendo al 1 después del 13. Se calcula
   con la fecha local del dispositivo, como el resto de la app. */
function pensOrdenEn(fechaISO){
  const a = String(fechaISO).split("-").map(Number);
  const dias = Math.round((Date.UTC(a[0], a[1] - 1, a[2]) - Date.UTC(2026, 10, 23)) / 86400000);
  const sem = Math.floor(dias / 7);
  return ((3 + sem) % 13 + 13) % 13 + 1;
}
function pensActivo(){
  const o = pensOrdenEn(TODAY);
  return DATA.pensamientos.find(p => p.orden === o) || DATA.pensamientos[0];
}
/* Texto del pensamiento ya escapado y con sus comillas: los textos que
   ya traen «» (frases cortas) se muestran tal cual; los demás se
   envuelven en «» como se ha hecho siempre en esta tarjeta. */
function pensQuote(t){
  const s = String(t == null ? "" : t).trim();
  if (s.charAt(0) === "«") return esc(s).replace(/\n/g, "<br>");
  return "«" + esc(/[.!?…]$/.test(s) ? s : s + ".") + "»";
}
function pensCardHTML(p, feat){
  const isAct = p.orden === pensActivo().orden;
  return '<div class="card thought' + (p.image ? "" : " penssoft") + '">' +
    (p.image ? imgHTML(p.image, p.descripcion || "Un pensamiento para meditar") : "") +
    (feat ? '<div class="k">✦ Un pensamiento para meditar</div>' : "") +
    '<div class="q">' + pensQuote(p.texto) + "</div>" +
    (p.referencia ? '<div class="pensref">' + esc(p.referencia) + "</div>" : "") +
    '<span class="tag">' + esc(p.tipo) + "</span>" +
    (isAct ? ' <span class="tag penswk">Esta semana</span>' : "") +
    "</div>";
}
/* ================= Utilidades ================= */

function applyFontSize(){
  const fz = store.get("ar1_fontsize","normal");
  const sizes = {normal:"16.5px", grande:"18.5px", muygrande:"20.5px"};
  document.body.style.fontSize = sizes[fz] || sizes.normal;
}
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const ACCENTS = {
  purpura:{name:"Púrpura", a:"#7b2d8b", d:"#5e2170"},
  azul:{name:"Azul", a:"#2471a3", d:"#1a5276"},
  verde:{name:"Verde", a:"#1e8449", d:"#145a32"},
  rojo:{name:"Rojo", a:"#c0392b", d:"#922b21"}
};
function applyAccent(){
  const key = store.get("ar1_accent","purpura");
  const ac = ACCENTS[key] || ACCENTS.purpura;
  document.documentElement.style.setProperty("--accent", ac.a);
  document.documentElement.style.setProperty("--accent-dark", ac.d);
}

/* ================= Versículos: detección y ventana flotante ================= */
const BOOKMAP = {
  "Génesis":["Génesis","Gén."],"Éxodo":["Éxodo","Éx."],"Levítico":["Levítico","Lev."],
  "Números":["Números","Núm."],"Deuteronomio":["Deuteronomio","Deut."],"Josué":["Josué","Jos."],
  "Jueces":["Jueces","Jue."],"Rut":["Rut"],
  "1 Samuel":["1 Samuel","1 Sam."],"2 Samuel":["2 Samuel","2 Sam."],
  "1 Reyes":["1 Reyes","1 Rey."],"2 Reyes":["2 Reyes","2 Rey."],
  "1 Crónicas":["1 Crónicas","1 Crón."],"2 Crónicas":["2 Crónicas","2 Crón."],
  "Esdras":["Esdras","Esd."],"Nehemías":["Nehemías","Neh."],"Ester":["Ester"],
  "Job":["Job"],"Salmo":["Salmos","Salmo","Sal."],"Proverbios":["Proverbios","Prov."],
  "Eclesiastés":["Eclesiastés","Ecl."],"Cantares":["Cantares","Cant."],
  "Isaías":["Isaías","Isa."],"Jeremías":["Jeremías","Jer."],"Lamentaciones":["Lamentaciones","Lam."],
  "Ezequiel":["Ezequiel","Ezeq."],"Daniel":["Daniel","Dan."],
  "Oseas":["Oseas"],"Joel":["Joel"],"Amós":["Amós"],"Abdías":["Abdías"],"Jonás":["Jonás"],
  "Miqueas":["Miqueas","Miq."],"Nahúm":["Nahúm"],"Habacuc":["Habacuc"],"Sofonías":["Sofonías"],
  "Ageo":["Ageo"],"Zacarías":["Zacarías","Zac."],"Malaquías":["Malaquías","Mal."],
  "Mateo":["Mateo","Mat."],"Marcos":["Marcos","Mar."],"Lucas":["Lucas","Luc."],
  "Juan":["Juan"],"Hechos":["Hechos","Hech."],"Romanos":["Romanos","Rom."],
  "1 Corintios":["1 Corintios","1 Cor."],"2 Corintios":["2 Corintios","2 Cor."],
  "Gálatas":["Gálatas","Gál."],"Efesios":["Efesios","Efes."],
  "Filipenses":["Filipenses","Filip."],"Colosenses":["Colosenses","Col."],
  "1 Tesalonicenses":["1 Tesalonicenses","1 Tes."],"2 Tesalonicenses":["2 Tesalonicenses","2 Tes."],
  "1 Timoteo":["1 Timoteo","1 Tim."],"2 Timoteo":["2 Timoteo","2 Tim."],
  "Tito":["Tito"],"Filemón":["Filemón"],"Hebreos":["Hebreos","Heb."],
  "Santiago":["Santiago","Sant."],"1 Pedro":["1 Pedro","1 Ped."],"2 Pedro":["2 Pedro","2 Ped."],
  "1 Juan":["1 Juan"],"2 Juan":["2 Juan"],"3 Juan":["3 Juan"],"Judas":["Judas"],
  "Apocalipsis":["Apocalipsis","Apoc."]
};
const REV = {}; const VARIANTS = [];
Object.keys(BOOKMAP).forEach(canon => BOOKMAP[canon].forEach(v => { REV[v.replace(/\.$/,"")] = canon; VARIANTS.push(v); }));
VARIANTS.sort((a,b) => b.length - a.length);
const REF_RE = new RegExp("(?<![A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9])(" + VARIANTS.map(v => v.replace(/\./g,"\\.")).join("|") + ")\\s+(\\d+):(\\d+)(?:\\s*[-–]\\s*(?:(\\d+):)?(\\d+)|\\s*,\\s*(\\d+))?", "g");
function canonRef(bookRaw, ch, v1, rngCh, rngV, listV){
  const canon = REV[bookRaw.replace(/\.$/,"")] || bookRaw;
  let r = canon + " " + ch + ":" + v1;
  if (rngV) r += "-" + (rngCh ? rngCh + ":" : "") + rngV;
  else if (listV) r += "," + listV;
  return r;
}
function linkify(escapedText){
  return escapedText.replace(REF_RE, (m, book, ch, v1, rngCh, rngV, listV) => {
    const canon = canonRef(book, ch, v1, rngCh, rngV, listV);
    return '<a class="ref" data-ref="' + esc(canon) + '" data-disp="' + esc(m) + '">' + m + "</a>";
  });
}
function normRef(canon){
  return String(canon == null ? "" : canon).replace(/\s+/g," ").replace(/,\s*/g,",").trim();
}
const VNORM = {};
Object.keys(DATA.verses).forEach(k => { VNORM[normRef(k)] = DATA.verses[k]; });
function verseLookup(canon){
  const n = normRef(canon);
  if (VNORM[n]) return VNORM[n];
  const m = n.match(/^(.+ \d+:\d+)[-,]/);
  if (m && VNORM[m[1]]) return VNORM[m[1]];
  return null;
}
/* Caché local de textos consultados en línea: misma normalización de clave que VNORM. */
const VCACHE_KEY = "ar1_verses_cache";
let VCACHE = store.get(VCACHE_KEY, {});
function verseCacheGet(canon){
  const n = normRef(canon);
  if (VCACHE[n]) return VCACHE[n];
  const m = n.match(/^(.+ \d+:\d+)[-,]/);
  if (m && VCACHE[m[1]]) return VCACHE[m[1]];
  return null;
}
function verseCacheSet(canon, text){
  VCACHE[normRef(canon)] = text;
  store.set(VCACHE_KEY, VCACHE);
}
let verseReqSeq = 0;
/* --- Tarjeta flotante arrastrable (estilo «Pasaje bíblico citado» de JW.org) --- */
const vcard = $("#vcard");
const vhead = $("#vcardHead");
function resetCardPos(){
  vcard.style.left = ""; vcard.style.top = ""; vcard.style.transform = "";
  const r = vcard.getBoundingClientRect();
  vcard.style.transform = "none";
  vcard.style.left = Math.max(8, Math.round(r.left)) + "px";
  vcard.style.top = Math.max(8, Math.round(r.top)) + "px";
}
let vdrag = null;
vhead.addEventListener("pointerdown", e => {
  if (e.target && e.target.closest && e.target.closest("#sheetClose")) return;
  const r = vcard.getBoundingClientRect();
  vdrag = { id: e.pointerId, dx: e.clientX - r.left, dy: e.clientY - r.top, w: r.width, h: r.height };
  try{ vhead.setPointerCapture(e.pointerId); }catch(err){}
  vcard.classList.add("drag");
  e.preventDefault();
});
vhead.addEventListener("pointermove", e => {
  if (!vdrag || e.pointerId !== vdrag.id) return;
  vcard.style.left = Math.max(8, Math.min(e.clientX - vdrag.dx, window.innerWidth - vdrag.w - 8)) + "px";
  vcard.style.top = Math.max(8, Math.min(e.clientY - vdrag.dy, window.innerHeight - vdrag.h - 8)) + "px";
});
function vdragEnd(e){
  if (vdrag && e.pointerId === vdrag.id){ vdrag = null; vcard.classList.remove("drag"); }
}
vhead.addEventListener("pointerup", vdragEnd);
vhead.addEventListener("pointercancel", vdragEnd);
/* --- Audio en streaming del capítulo oficial (sin descargar ni almacenar) --- */
const vaud = $("#vaud");
const vaudBtn = $("#vaudBtn");
const vaudIco = $("#vaudIco");
const ICO_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
const ICO_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" fill="currentColor"/><rect x="14" y="5" width="4" height="14" fill="currentColor"/></svg>';
let vAudioData = null;  // {url, start, end} del pasaje abierto
let vSeekTo = null;     // segundo al que saltar en cuanto el audio esté listo
function audIcon(){ vaudIco.innerHTML = vaud.paused ? ICO_PLAY : ICO_PAUSE; }
function stopVerseAudio(){
  vSeekTo = null;
  try{ vaud.pause(); }catch(e){}
  audIcon();
}
function setVerseAudio(audio){
  vAudioData = (audio && audio.url) ? audio : null;
  vaudBtn.hidden = !vAudioData;
  if (!vAudioData) stopVerseAudio(); else audIcon();
}
vaud.addEventListener("loadedmetadata", () => {
  if (vSeekTo != null){ try{ vaud.currentTime = vSeekTo; }catch(e){} vSeekTo = null; }
});
vaud.addEventListener("play", audIcon);
vaud.addEventListener("pause", audIcon);
vaud.addEventListener("ended", audIcon);
vaud.addEventListener("timeupdate", () => {
  if (vAudioData && vAudioData.end != null && !vaud.paused && vaud.currentTime >= vAudioData.end) vaud.pause();
});
vaud.addEventListener("error", () => { vAudioData = null; vaudBtn.hidden = true; audIcon(); });
vaudBtn.addEventListener("click", () => {
  if (!vAudioData) return;
  if (!vaud.paused){ vaud.pause(); return; }
  const a = vAudioData, start = a.start || 0;
  let abs = a.url;
  try{ abs = new URL(a.url, window.location.href).href; }catch(e){}
  if (vaud.src !== abs){
    vSeekTo = start;
    vaud.src = a.url;
    try{ vaud.load(); }catch(e){}
  } else if (vaud.ended || vaud.currentTime < start || (a.end != null && vaud.currentTime >= a.end)){
    vSeekTo = null;
    try{ vaud.currentTime = start; }catch(e){}
  }
  try{ const p = vaud.play(); if (p && p.catch) p.catch(() => {}); }catch(e){}
});
audIcon();
/* --- Reproductor de publicaciones (Guía de actividades y La Atalaya) ---
   Audio oficial en streaming: la URL del CDN se resuelve en el momento con
   /api/audio a partir de {pub, issue, track}; la URL nunca se guarda.
   La barra vive fuera de las rutas: sigue sonando al cambiar de pantalla. */
const paud = $("#paud");
const pubbar = $("#pubbar");
const pbTitle = $("#pbTitle"), pbMsg = $("#pbMsg"), pbPlay = $("#pbPlay"), pbIco = $("#pbIco"),
      pbSeek = $("#pbSeek"), pbCur = $("#pbCur"), pbDur = $("#pbDur"),
      pbBack = $("#pbBack"), pbFwd = $("#pbFwd");
const ICO_HEADPHONES = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3v5zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3v5z"/></svg>';
let pubSeq = 0;          // descarta respuestas tardías de /api/audio
let pubReady = false;    // hay una pista cargada y lista para reproducir
let pubSeeking = false;  // el usuario está arrastrando la barra de progreso
function fmtTime(s){
  if (s == null || !isFinite(s) || s < 0) return "0:00";
  s = Math.floor(s);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function pubIcon(){ pbIco.innerHTML = paud.paused ? ICO_PLAY : ICO_PAUSE; }
function pubControls(on){
  pbPlay.disabled = !on; pbBack.disabled = !on; pbFwd.disabled = !on; pbSeek.disabled = !on;
}
function pubShowMsg(msg){
  pbMsg.textContent = msg || "";
  pbMsg.classList.toggle("show", !!msg);
}
function closePubPlayer(){
  pubSeq++;
  pubReady = false;
  try{ paud.pause(); }catch(e){}
  try{ paud.removeAttribute("src"); paud.load(); }catch(e){}
  pubbar.hidden = true;
  document.body.classList.remove("pubopen");
  pubShowMsg("");
  pubIcon();
}
function playPubAudio(ref, fallbackTitle){
  if (!ref) return;
  stopVerseAudio();            // coordinación: un solo audio a la vez
  const seq = ++pubSeq;
  pubbar.hidden = false;
  document.body.classList.add("pubopen");
  pubReady = false;
  pubControls(false);
  pubShowMsg("");
  pbTitle.textContent = "Cargando…";
  pbCur.textContent = "0:00"; pbDur.textContent = "0:00";
  pbSeek.max = 0; pbSeek.value = 0;
  pubIcon();
  fetch("/api/audio?pub=" + encodeURIComponent(ref.pub) + "&issue=" + encodeURIComponent(ref.issue) + "&track=" + encodeURIComponent(ref.track))
    .then(r => r.json().catch(() => null).then(j => ({ ok: r.ok, j: j })))
    .then(res => {
      if (seq !== pubSeq) return;
      const j = res.j;
      if (!res.ok || !j || !j.url){
        pbTitle.textContent = fallbackTitle || "Audio";
        pubShowMsg("No se pudo cargar el audio. Revisa tu conexión e inténtalo de nuevo.");
        pubControls(false);
        return;
      }
      pbTitle.textContent = j.title || fallbackTitle || "Audio";
      let abs = j.url;
      try{ abs = new URL(j.url, window.location.href).href; }catch(e){}
      if (paud.src !== abs){
        paud.src = j.url;
        try{ paud.load(); }catch(e){}
      }
      pubReady = true;
      pubControls(true);
      try{ const p = paud.play(); if (p && p.catch) p.catch(() => {}); }catch(e){}
    })
    .catch(() => {
      if (seq !== pubSeq) return;
      pbTitle.textContent = fallbackTitle || "Audio";
      pubShowMsg("No se pudo cargar el audio. Revisa tu conexión e inténtalo de nuevo.");
      pubControls(false);
    });
}
paud.addEventListener("play", () => { stopVerseAudio(); pubIcon(); });
paud.addEventListener("pause", pubIcon);
paud.addEventListener("ended", pubIcon);
paud.addEventListener("loadedmetadata", () => {
  pbDur.textContent = fmtTime(paud.duration);
  if (isFinite(paud.duration)) pbSeek.max = paud.duration;
});
paud.addEventListener("timeupdate", () => {
  if (!pubSeeking) pbSeek.value = paud.currentTime || 0;
  pbCur.textContent = fmtTime(paud.currentTime);
});
paud.addEventListener("error", () => {
  if (pubReady) pubShowMsg("Hubo un problema al reproducir el audio.");
});
pbPlay.addEventListener("click", () => {
  if (!pubReady) return;
  if (!paud.paused){ paud.pause(); return; }
  try{ const p = paud.play(); if (p && p.catch) p.catch(() => {}); }catch(e){}
});
pbBack.addEventListener("click", () => {
  if (!pubReady) return;
  try{ paud.currentTime = Math.max(0, (paud.currentTime || 0) - 5); }catch(e){}
});
pbFwd.addEventListener("click", () => {
  if (!pubReady) return;
  try{
    const t = (paud.currentTime || 0) + 15;
    paud.currentTime = isFinite(paud.duration) ? Math.min(paud.duration, t) : t;
  }catch(e){}
});
pbSeek.addEventListener("input", () => { pubSeeking = true; pbCur.textContent = fmtTime(parseFloat(pbSeek.value)); });
pbSeek.addEventListener("change", () => {
  if (pubReady){ try{ paud.currentTime = parseFloat(pbSeek.value) || 0; }catch(e){} }
  pubSeeking = false;
});
$("#pbClose").addEventListener("click", closePubPlayer);
/* Coordinación inversa: si empieza a sonar el versículo, se pausa la publicación. */
vaud.addEventListener("play", () => { try{ paud.pause(); }catch(e){} });
pubIcon();
pubControls(false);
/* --- Contenido de la tarjeta --- */
function wolHref(canon, apiUrl){
  return apiUrl || ("https://wol.jw.org/es/wol/l/r4/lp-s?q=" + encodeURIComponent(canon));
}
function versesHTML(j){
  if (j && j.verses && j.verses.length){
    return j.verses.map(v => (v.n ? '<span class="vn">' + esc(v.n) + "</span> " : "") + esc(v.text)).join(" ");
  }
  return esc(j && j.text ? j.text : "");
}
function verseShowMeta(canon, apiUrl){
  $("#sheetSrc").textContent = "Traducción del Nuevo Mundo · JW.org";
  $("#sheetLink").innerHTML = '<a class="wolmini" target="_blank" rel="noopener" href="' + esc(wolHref(canon, apiUrl)) + '">Ver en JW.org</a>';
}
function verseShowFallback(canon, apiUrl){
  setVerseAudio(null);
  $("#sheetText").textContent = "Este versículo todavía no está guardado en la app.";
  $("#sheetSrc").textContent = "";
  $("#sheetLink").innerHTML = '<a class="wol" target="_blank" rel="noopener" href="' + esc(wolHref(canon, apiUrl)) + '">Ver en JW.org</a>';
}
function fetchVerseOnline(canon, seq, bg){
  fetch("/api/texto?q=" + encodeURIComponent(canon)).then(r => {
    return r.json().catch(() => null).then(j => ({ ok: r.ok, j: j }));
  }).then(res => {
    const j = res.j;
    if (res.ok && j && j.text) verseCacheSet(canon, j.text);
    if (seq !== verseReqSeq) return;
    if (res.ok && j && j.text){
      if (!bg){ $("#sheetText").innerHTML = versesHTML(j); verseShowMeta(canon, j.url || ""); }
      else if (j.verses && j.verses.length){ $("#sheetText").innerHTML = versesHTML(j); }
      setVerseAudio(j.audio || null);
    } else if (!bg) {
      verseShowFallback(canon, j && j.url ? j.url : "");
    }
  }).catch(() => {
    if (seq !== verseReqSeq) return;
    if (!bg) verseShowFallback(canon, "");
  });
}
function openVerse(canon, disp){
  const seq = ++verseReqSeq;
  stopVerseAudio();
  vAudioData = null; vaudBtn.hidden = true;
  $("#sheetRef").textContent = disp || canon;
  $("#sheetSrc").textContent = "";
  $("#sheetLink").innerHTML = "";
  const local = verseLookup(canon) || verseCacheGet(canon);
  if (local){
    $("#sheetText").textContent = local;
    verseShowMeta(canon, "");
    $("#sheetWrap").classList.add("open");
    resetCardPos();
    fetchVerseOnline(canon, seq, true);
    return;
  }
  $("#sheetText").textContent = "Buscando el texto…";
  $("#sheetWrap").classList.add("open");
  resetCardPos();
  fetchVerseOnline(canon, seq, false);
}
function closeVerse(){
  verseReqSeq++;
  stopVerseAudio();
  vAudioData = null; vaudBtn.hidden = true;
  $("#sheetWrap").classList.remove("open");
}
$("#sheetClose").addEventListener("click", closeVerse);

/* ================= Bloques de texto y subrayado ================= */
const BLOCKTEXT = {};
const HL_COLORS = [
  ["amarillo","#f7dc6f"],["verde","#a8dd8a"],["azul","#8ecdf0"],["morado","#c3aef0"],
  ["rosa","#f7a8c4"],["naranja","#ffb98a"],["coral","#ff9d8a"],["cian","#7fdcd2"],["menta","#a9e5bb"]
];
let HL = store.get("ar1_highlights", {});
const HEADLINE_RE = /^[A-ZÁÉÍÓÚÑ¿?¡! ,;:()«»-]+$/;
function blocks(text, prefix){
  if (!text) return "";
  const out = []; let i = 0;
  String(text).split(/\n\n+/).forEach(chunk => {
    chunk.split(/\n/).forEach(line => {
      line = line.trim(); if (!line) return;

function newsHTML(){
  const items = newsItems();

  const show = newsAll ? items : items.slice(0, 6);
  let h = '<h2 class="sec">Lo nuevo</h2><div class="card">' + show.map(newsCardHTML).join("") + "</div>";
  if (!newsAll && items.length > 6)
    h += '<button class="primary" data-news="all" style="margin-bottom:14px">Ver todas</button>';

}

function head(title, sub){
  return "<h1 class=\"screen\">" + esc(title) + "</h1>" + (sub ? '<div class="meta">' + sub + "</div>" : "");
}
function chips(arr){ return arr.map(c => '<span class="chip">' + c + "</span>").join(""); }

/* ================= Imágenes de contenido y semanas =================
   imgSeq decide el loading: la primera imagen de cada pantalla va «eager»
   y las demás «lazy»; render() lo reinicia en cada pantalla. */
let imgSeq = 0;
function imgHTML(src, alt){
  imgSeq++;
  return '<img class="cimg" src="' + esc(src) + '" alt="' + esc(alt || "") + '" loading="' + (imgSeq === 1 ? "eager" : "lazy") + '">';
}
function figHTML(src, caption, alt){
  imgSeq++;
  return '<figure class="cfig"><img class="cimg" src="' + esc(src) + '" alt="' + esc(alt || "") + '" loading="' + (imgSeq === 1 ? "eager" : "lazy") + '">' +
    (caption ? "<figcaption>" + esc(caption) + "</figcaption>" : "") + "</figure>";
}
/* Las imágenes de data.js pueden venir como texto («img/x.jpg») o como objeto
   {src, caption, alt, asterisk} cuando en Base44 tenían pie de foto (visible),
   descripción (texto alternativo) o nota de asterisco (también accesible). */
function imgSrc(e){ return typeof e === "string" ? e : e.src; }
function imgAlt(e, fallback){
  if (typeof e === "string") return fallback || "";
  const a = [e.alt, e.asterisk].filter(Boolean).join(" ");
  return a || fallback || "";
}
function imgFig(e, fallbackAlt){
  if (typeof e === "string") return imgHTML(e, fallbackAlt);
  return e.caption ? figHTML(e.src, e.caption, imgAlt(e, fallbackAlt)) : imgHTML(e.src, imgAlt(e, fallbackAlt));
}
/* Imagen suelta (campo image de una parte): con pie si lo trae en data.js. */
function oneImg(src, caption, alt){ return caption ? figHTML(src, caption, alt) : imgHTML(src, alt); }
function wkOf(wi){ return WEEKS[(wi >= 0 && wi < WEEKS.length) ? wi : 0]; }
function wkPrefix(wi){ return wi === 0 ? "" : "w" + wi + "-"; }
function wkSuffix(wi){ return wi === 0 ? "" : "-w" + wi; }
function wkRoute(base, wi){ return wi === 0 ? "#/" + base : "#/" + base + "/" + wi; }
/* Lista «Semanas anteriores» al final de cada sección de reunión: enlaza a
   la misma sección en cada semana VISIBLE (las futuras no aparecen),
   ordenadas de la más reciente a la más antigua; la primera es la actual. */
function weeksListHTML(section, wi, icon, smallFn){
  const rows = VISIBLE.map(i2 => { const w2 = WEEKS[i2];
    return '<button class="row" data-go="#/' + section + "/" + i2 + '"><span class="ric">' + icon + '</span><span>' + esc(w2.range) +
    "<small>" + esc(smallFn(w2, i2)) + (i2 === CUR ? " · Semana actual" : "") + (i2 === wi ? " · Viendo ahora" : "") +
    '</small></span><span class="arr">›</span></button>'; }).join("");
  return '<h2 class="sec">Semanas anteriores</h2><div class="card">' + rows + "</div>";
}

/* Botones «Escuchar» del reproductor de publicaciones: solo aparecen
   cuando la semana trae la referencia de audio en data.js. */
function guiaBtnHTML(wk, wi){
  if (!wk.audioGuia) return "";
  return '<button class="listenbtn" data-pubaudio="guia" data-wi="' + wi + '">' + ICO_HEADPHONES + "<span>Escuchar la guía de esta semana</span></button>";
}
function atalayaBtnHTML(wk, wi){
  if (!wk.audioAtalaya) return "";

}
/* Semanas parciales: las secciones que una semana no trae en data.js
   muestran una nota sencilla, sin errores, con la lista de semanas. */
function sinContenidoHTML(section, wi, icon, title, smallFn){
  const wk = WEEKS[wi], id = section + wkSuffix(wi);
  return screenBar(id, title, wkRoute(section, wi)) +
    head(title, chips([wk.range])) +
    (section !== "atalaya" ? guiaBtnHTML(wk, wi) : "") +
    '<div class="empty">Sin contenido para esta semana.</div>' +
    weeksListHTML(section, wi, icon, smallFn) +
    noteBox(id);
}
function tesorosHTML(wi){
  wi = resolveWi(wi);

/* Semanas disponibles para Perlas: si data.js trae un arreglo «weeks» se usa
   ese; si no, la semana única actual (DATA.week). La primera es la actual.
   Los bloques de la semana actual conservan sus ids «perla-N» de siempre
   para no perder los subrayados guardados; las demás semanas usan
   «perla-w<semana>-N» para que sus subrayados no se crucen. */
const WEEKS = (Array.isArray(DATA.weeks) && DATA.weeks.length) ? DATA.weeks : [W];
/* ================= Fechas y visibilidad por fecha =================
   Como en Base44: cada semana se hace visible a partir de su fecha de
   inicio («Desde»). La «semana actual» es la cuyo rango incluye HOY
   (fecha local del dispositivo); si hoy no cae en ninguna, la pasada más
   reciente. Las semanas futuras NO aparecen en Inicio ni en las listas
   «Semanas anteriores», y navegar a su ruta muestra la semana actual. */
function todayISO(){
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
const TODAY = todayISO();
function wkVisible(w){ return !w.startDate || w.startDate <= TODAY; }
/* Índices visibles, de la semana más reciente a la más antigua. */
const VISIBLE = WEEKS.map((w, i) => i).filter(i => wkVisible(WEEKS[i]))
  .sort((a, b) => (WEEKS[a].startDate || "") < (WEEKS[b].startDate || "") ? 1 : -1);
let CUR;
if (VISIBLE.length) CUR = VISIBLE[0];
else { /* El dispositivo marca una fecha anterior a todas las semanas. */
  CUR = 0;
  WEEKS.forEach((w, i) => { if ((w.startDate || "") < (WEEKS[CUR].startDate || "")) CUR = i; });
  VISIBLE.push(CUR);
}
/* Índice pedido por la ruta → índice mostrable: fuera de rango o semana
   futura ⇒ la semana actual. Los índices visibles se respetan tal cual,
   así los enlaces internos por índice siguen funcionando. */
function resolveWi(wi){
  if (wi == null || isNaN(wi) || wi < 0 || wi >= WEEKS.length) return CUR;
  return wkVisible(WEEKS[wi]) ? wi : CUR;
}
function perlasHTML(wi){
  wi = resolveWi(wi);
  const wk = WEEKS[wi];
  const list = wk.perlas || [];
  const base = (wi === 0 ? "perla-" : "perla-w" + wi + "-");
  let items = "";
  /* Imagen de encabezado de la semana (solo semanas que la traen en
     data.js): va arriba de la lista, antes del texto introductorio, con
     su pie de foto cuando la semana lo trae. */
  if (wk.perlasImage) items += wk.perlasImageCaption ? figHTML(wk.perlasImage, wk.perlasImageCaption, wk.perlasImageCaption) : imgHTML(wk.perlasImage, "Busquemos perlas escondidas");
  /* Texto introductorio de la semana (solo semanas que lo traen en data.js):
     va arriba de la lista, en la misma tarjeta .pearl. */
  if (wk.perlasIntro) items += '<div class="pearl">' + blocks(wk.perlasIntro, base + "intro") + "</div>";
  let summaryHeadDone = false;
  items += list.map((p,i) => {
    let h = "";
    /* Las perlas marcadas «summary» son los comentarios de resumen: llevan
       su propio encabezado la primera vez que aparecen (al final). */
    if (p.summary && !summaryHeadDone){ h += '<h2 class="sec">Comentarios de resumen</h2>'; summaryHeadDone = true; }
    h += '<div class="pearl"><div class="pref">' + linkify(esc(p.ref)) + "</div>" +
      blocks(p.comment, base + i) + "</div>";
    return h;
  }).join("");
  /* Párrafo de cierre de la semana, al final, en la misma tarjeta .pearl. */
  if (wk.perlasClosing) items += '<div class="pearl">' + blocks(wk.perlasClosing, base + "cierre") + "</div>";
  return screenBar("perlas","Busquemos perlas escondidas","#/perlas") +
    head("Busquemos perlas escondidas", chips([wk.range, list.length + " perlas"])) + guiaBtnHTML(wk, wi) + items +
    weeksListHTML("perlas", wi, "💎", w2 => (w2.perlas ? w2.perlas.length : 0) + " perlas") +
    noteBox("perlas");
}
function vidaHTML(wi){
  wi = resolveWi(wi);
  const wk = WEEKS[wi], v = wk.vida, p = wkPrefix(wi), id = "vida" + wkSuffix(wi);
  if (!v) return sinContenidoHTML("vida", wi, "👥", "Nuestra vida cristiana", w2 => w2.vida ? w2.vida.title : "Sin contenido");
  let h = screenBar(id, "Nuestra vida cristiana", wkRoute("vida", wi)) +
    head("Nuestra vida cristiana", chips([wk.range, v.subtitle, v.duration])) +
    guiaBtnHTML(wk, wi) +
    "<h1 class=\"screen\" style=\"font-size:20px\">" + esc(v.title) + "</h1>";
  if (v.image && v.imageAfterSection == null) h += oneImg(v.image, v.imageCaption, v.imageAlt || v.title);
  h += v.sections.map((s,i) => {
    let sh = "<h2 class=\"sec\">" + esc(s.label) + "</h2>" + blocks(s.text, p + "vida-" + i);
    if (v.image && v.imageAfterSection === i) sh += oneImg(v.image, v.imageCaption, v.imageAlt || v.title);
    return sh;
  }).join("");
  return h + weeksListHTML("vida", wi, "👥", w2 => w2.vida ? w2.vida.title : "Sin contenido") + noteBox(id);
}
function estudioHTML(wi){
  wi = resolveWi(wi);
  const wk = WEEKS[wi], e0 = wk.estudio, p = wkPrefix(wi), id = "estudio" + wkSuffix(wi);
  if (!e0) return sinContenidoHTML("estudio", wi, "🎓", "Estudio bíblico de la congregación", w2 => w2.estudio ? w2.estudio.chapter : "Sin contenido");
  const items = e0.items.map((it, i) => {
    const key = it.n != null ? it.n : "x" + i;
    let h = "";
    if (it.group) h += "<h2 class=\"sec\">" + esc(it.group) + "</h2>";
    if (it.q) h += '<div class="qline">' + (it.n != null ? it.n + ". " : "") + linkify(esc(it.q)) + "</div>";
    if (it.extra) h += '<p class="blk" style="font-style:italic;color:var(--muted)">Investigue un poco más: ' + linkify(esc(it.extra)) + "</p>";
    if (it.image && !it.sub) h += imgHTML(it.image, it.q || e0.chapter);
    if (it.a) h += blocks(it.a, p + "est-" + key + "-a");
    if (it.sub) h += it.sub.map((s, j) =>
      '<div class="qline">' + linkify(esc(s.q)) + "</div>" + blocks(s.a, p + "est-" + key + "-s" + j)).join("");
    if (it.image && it.sub) h += imgHTML(it.image, it.group || e0.chapter);
    return h;
  }).join("");
  return screenBar(id, "Estudio bíblico de la congregación", wkRoute("estudio", wi)) +
    head("Estudio bíblico de la congregación", chips([wk.range, "Lectura: " + e0.reading])) +
    guiaBtnHTML(wk, wi) +
    "<h1 class=\"screen\" style=\"font-size:20px\">" + esc(e0.book) + " — " + esc(e0.chapter) + "</h1>" +
    (e0.intro ? blocks(e0.intro, p + "est-intro") : "") +
    (e0.image ? imgHTML(e0.image, e0.chapter) : "") + items +
    weeksListHTML("estudio", wi, "🎓", w2 => w2.estudio ? w2.estudio.chapter : "Sin contenido") +
    noteBox(id);
}
function discursoHTML(wi){
  wi = resolveWi(wi);
  const wk = WEEKS[wi], d = wk.discurso, p = wkPrefix(wi), id = "discurso" + wkSuffix(wi);
  if (!d) return sinContenidoHTML("discurso", wi, "🎤", "Discurso público", w2 => (w2.discurso && w2.discurso.title) || "Sin contenido publicado");
  const sinTitulo = !(d.title && String(d.title).trim());
  if (sinTitulo){
    return screenBar(id, "Discurso público", wkRoute("discurso", wi)) +
      head("Discurso público", chips([wk.range])) +
      guiaBtnHTML(wk, wi) +
      '<div class="empty">El desarrollo de este discurso todavía no se ha publicado.<br>Cuando esté disponible, aparecerá aquí.</div>' +
      (d.note ? '<div class="extrabox"><div class="k">Nota</div>' + blocks(d.note, p + "discurso-nota") + "</div>" : "") +
      weeksListHTML("discurso", wi, "🎤", w2 => (w2.discurso && w2.discurso.title) || "Próximamente") +
      noteBox(id);
  }
  const kv = (label, val) => val ? '<div class="kvrow"><span class="kvl">' + label + '</span><span class="kvv">' + esc(val) + "</span></div>" : "";
  const rows = kv("Presidente", d.presidente || d.president) +
    kv("Canción", d.cancion || d.song) +
    kv("Oración", d.oracion || d.prayer) +
    kv("Orador", d.orador || d.speaker) +
    kv("Título del discurso", d.title);
  const metaChips = [];
  if (d.number) metaChips.push("Conferencia pública n.º " + d.number);
  if (d.duration) metaChips.push(d.duration);
  return screenBar(id, "Discurso público", wkRoute("discurso", wi)) +
    head("Discurso público", chips([wk.range])) +
    guiaBtnHTML(wk, wi) +
    (rows ? '<div class="kv">' + rows + "</div>" : "") +
    (metaChips.length ? '<div class="meta">' + chips(metaChips) + "</div>" : "") +
    (d.textRef ? blocks("Texto bíblico: " + d.textRef, p + "discurso-ref") : "") +
    (d.note ? '<div class="extrabox"><div class="k">Nota</div>' + blocks(d.note, p + "discurso-nota") + "</div>" : "") +
    weeksListHTML("discurso", wi, "🎤", w2 => (w2.discurso && w2.discurso.title) || "Próximamente") +
    noteBox(id);
}
function atalayaHTML(wi){
  wi = resolveWi(wi);
  const wk = WEEKS[wi], a0 = wk.atalaya, bp = wkPrefix(wi), id = "atalaya" + wkSuffix(wi);
  if (!a0) return sinContenidoHTML("atalaya", wi, "📚", "Estudio de La Atalaya", w2 => w2.atalaya ? w2.atalaya.title : "Sin contenido");
  const ps = a0.paragraphs.map(p => {
    let h = "";
    if (p.heading) h += "<h2 class=\"sec\">" + esc(p.heading) + "</h2>";
    h += '<div class="qline">' + p.num + ". " + linkify(esc(p.q)) + "</div>";
    if (p.image) h += figHTML(p.image, p.imageCaption, p.imageAsterisk ? (p.q ? p.q + " " + p.imageAsterisk : p.imageAsterisk) : p.q);

      h += '<div class="extrabox"><div class="k">Pregunta adicional</div>' +

        blocks(p.extraA, bp + "ata-" + p.num.replace(/\s/g,"") + "-ea") + "</div>";

      h += '<div class="extrabox"><div class="k">Pregunta adicional</div>' +
        '<div class="qline" style="margin-top:4px">' + linkify(esc(p.extraQ2)) + "</div>" +
        blocks(p.extraA2, bp + "ata-" + p.num.replace(/\s/g,"") + "-ea2") + "</div>";
    }
    return h;
  }).join("");
  return screenBar(id, "Estudio de La Atalaya", wkRoute("atalaya", wi)) +
    head("Estudio de La Atalaya", chips([a0.dateLabel])) +
    "<h1 class=\"screen\" style=\"font-size:20px\">" + esc(a0.title) + "</h1>" +
    atalayaBtnHTML(wk, wi) +
    blocks(a0.themeText, bp + "ata-tema") + ps +
    weeksListHTML("atalaya", wi, "📚", w2 => w2.atalaya ? w2.atalaya.title : "Sin contenido") +
    noteBox(id);
}
function textosHTML(){

  const hasToday = DATA.daily.some(d => d.date === today);
  const btnHoy = hasToday ? '<button class="primary" data-go="#/texto/' + today + '" style="margin-bottom:12px">📅 Ir al texto de hoy</button>' : '';
  const rows = DATA.daily.map(d => {
    const isToday = d.date === today;
    return '<button class="row" data-go="#/texto/' + d.date + '"' + (isToday ? ' style="background:#fbf7fd;border-left:4px solid var(--accent)"' : '') + '><span class="ric">📖</span><span>' +
      esc(d.label) + (isToday ? ' <span class="tag penswk">Hoy</span>' : '') + "<small>" + esc(d.weekday) + " · " + esc(d.ref) + '</small></span><span class="arr">›</span></button>';
  }).join("");
  return head("Texto diario", chips([DATA.daily.length + " textos"])) + btnHoy + '<div class="card">' + rows + "</div>";
}
function textoHTML(d){
  const id = "texto-" + d.date;
  const imgs = d.images || [];
  let mainImg = "", extraImgs = "";
  if (imgs.length){
    mainImg = imgFig(imgs[0], d.ref);
    if (imgs.length > 1 && d.example) extraImgs = imgs.slice(1).map(s => imgFig(s, d.ref)).join("");
    else if (imgs.length > 1) mainImg += imgs.slice(1).map(s => imgFig(s, d.ref)).join("");
  }
  let h = screenBar(id, "Texto diario — " + d.label, "#/texto/" + d.date) +
    head(d.label, chips([d.weekday])) +
    blocks(d.verse, id + "-verse") +
    '<div class="pref" style="font-weight:700;font-size:19px">' + linkify(esc(d.ref)) + "</div>" +
    (d.link ? '<div style="margin:12px 0 4px"><a class="jwlink" href="' + esc(d.link) + '" target="_blank" rel="noopener">Ver en JW.org</a></div>' : "") +
    mainImg +
    "<h2 class=\"sec\">COMENTARIO</h2>" + blocks(d.comment, id + "-comment");
  if (d.example) h += "<h2 class=\"sec\">EJEMPLO</h2>" + extraImgs + blocks(d.example, id + "-example");
  h += "<h2 class=\"sec\">LECCIONES PRÁCTICAS</h2>" + blocks(d.lessons, id + "-lessons");
  return h + noteBox(id);
}

function panelAutoFill(){
  const txt = panelGetVal("#panelPaste"); if(!txt.trim()){ panelStatus("Pega primero el texto de Dola o ChatGPT."); return; }
  const w = panelEnsureWeekShape(panelWeek());
  const low = txt.toLowerCase();
  function sectionAfter(keyword){
    const idx = low.indexOf(keyword);
    if(idx===-1) return "";

    const stops = ["tesoros de la biblia","busquemos perlas","nuestra vida cristiana","seamos mejores maestros","estudio bíblico","estudio biblico","discurso público","discurso publico","estudio de la atalaya","atalaya","texto diario"];
    let end = rest.length;
    const rlow = rest.toLowerCase();
    stops.forEach(s=>{ if(s===keyword) return; const j=rlow.indexOf(s); if(j>5 && j<end) end=j; });
    return rest.slice(0,end).trim();
  }
  let filled=0;
  const tes = sectionAfter("tesoros de la biblia") || sectionAfter("tesoros");
  if(tes){ w.tesoros.development = tes; const first = tes.split("\n").map(x=>x.trim()).find(x=>x.length>3 && x.length<140); if(first && !w.tesoros.title) w.tesoros.title = first.replace(/^[^:]*:\s*/,""); filled++; }

    const matches=[...per.matchAll(refRe)];
    if(matches.length){
      const arr=[]; matches.forEach((m,i)=>{ const start=m.index; const end=(i+1<matches.length?matches[i+1].index:per.length); const comment=per.slice(start+m[0].length,end).trim(); arr.push({ref:m[0],comment:comment,summary:false}); });
      w.perlas=arr; filled++;
    } else { w.perlas.push({ref:"",comment:per,summary:false}); filled++; }
  }
  const vidaSec = sectionAfter("vida cristiana") || sectionAfter("seamos mejores maestros");
  if(vidaSec){ if(!w.vida.sections.length) w.vida.sections.push({label:"",text:vidaSec}); else w.vida.sections[0].text=vidaSec; filled++; }
  const est = sectionAfter("estudio bíblico") || sectionAfter("estudio biblico");
  if(est){ if(!w.estudio.items.length) w.estudio.items.push({n:1,q:"",a:est,extra:""}); else w.estudio.items[0].a=est; filled++; }
  const dis = sectionAfter("discurso público") || sectionAfter("discurso publico");
  if(dis){ w.discurso.note = dis; const first=dis.split("\n").map(x=>x.trim()).find(x=>x.length>3&&x.length<140); if(first&&!w.discurso.title) w.discurso.title=first; filled++; }
  const ata = sectionAfter("estudio de la atalaya") || sectionAfter("atalaya");
  if(ata){ if(!w.atalaya.paragraphs.length) w.atalaya.paragraphs.push({num:1,q:"",a:ata,extraQ:"",extraA:""}); else w.atalaya.paragraphs[0].a=ata; const first=ata.split("\n").map(x=>x.trim()).find(x=>x.length>3&&x.length<140); if(first&&!w.atalaya.title) w.atalaya.title=first; filled++; }

function splitParagraphs(txt){
  if(!txt) return [];
  const t=String(txt).trim();
  // Separar por párrafos numerados o por líneas en blanco
  if(/\n\s*\d+\s*[.)]/.test(t)){
    const parts=t.split(/\n\s*(?=\d+\s*[.)])/).map(x=>x.trim()).filter(Boolean);
    if(parts.length>1) return parts;
  }
  return t.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
}
function firstLines(txt, n){
  return String(txt||"").split("\n").map(x=>x.trim()).filter(Boolean).slice(0,n||2);
}
function parseTesorosPaste(txt){
  const w=panelEnsureWeekShape(panelWeek());
  const lines=firstLines(txt,6);
  // Título: primera línea corta
  if(lines[0] && lines[0].length<140 && !/minutos|min\./i.test(lines[0])) w.tesoros.title=lines[0];
  // Lectura: línea con referencia bíblica o "Lectura:"
  const lectLine=lines.find(l=>/lectura|jueces|ezequiel|salmo|mateo|lucas|juan|hechos|romanos|1 |2 /i.test(l));
  if(lectLine) w.tesoros.reading=lectLine.replace(/lectura\s*:\s*/i,"");
  const durLine=lines.find(l=>/minutos|min\./i.test(l));
  if(durLine) w.tesoros.duration=durLine.match(/\d+\s*minutos?/i)?.[0]||durLine;
  // Desarrollo: todo el texto, dividido por párrafos, quitando título/lectura/duración iniciales si se detectan
  let body=txt;
  // Objetivo: buscar sección "Objetivo"
  const objMatch=txt.match(/objetivo\s*:\s*([\s\S]*?)(?:\n\s*\n|desarrollo\s*:|$)/i);
  if(objMatch) w.tesoros.objective=objMatch[1].trim();
  w.tesoros.development=splitParagraphs(body).join("\n\n");
  panelLoadWeek();
  panelStatus("Tesoros separado por párrafos. Revisa y corrige.");
}
function parsePerlasPaste(txt){
  const w=panelEnsureWeekShape(panelWeek());
  const refRe=/(Génesis|Éxodo|Levítico|Números|Deuteronomio|Josué|Jueces|Rut|1 Samuel|2 Samuel|1 Reyes|2 Reyes|1 Crónicas|2 Crónicas|Esdras|Nehemías|Ester|Job|Salmo|Salmos|Proverbios|Eclesiastés|Cantares|Isaías|Jeremías|Lamentaciones|Ezequiel|Daniel|Oseas|Joel|Amós|Abdías|Jonás|Miqueas|Nahúm|Habacuc|Sofonías|Hageo|Zacarías|Malaquías|Mateo|Marcos|Lucas|Juan|Hechos|Romanos|1 Corintios|2 Corintios|Gálatas|Efesios|Filipenses|Colosenses|1 Tesalonicenses|2 Tesalonicenses|1 Timoteo|2 Timoteo|Tito|Filemón|Hebreos|Santiago|1 Pedro|2 Pedro|1 Juan|2 Juan|3 Juan|Judas|Apocalipsis)\s+\d+:\d+(?:[-–]\d+)?/g;
  const matches=[...txt.matchAll(refRe)];
  if(matches.length){
    const arr=[]; matches.forEach((m,i)=>{ const start=m.index; const end=(i+1<matches.length?matches[i+1].index:txt.length); const comment=txt.slice(start+m[0].length,end).trim(); arr.push({ref:m[0],comment:comment,summary:false}); });
    w.perlas=arr;
  } else {
    w.perlas=[{ref:"",comment:txt,summary:false}];
  }
  panelLoadWeek();
  panelStatus("Perlas separadas: "+w.perlas.length+". Revisa.");
}
function parseVidaPaste(txt){
  const w=panelEnsureWeekShape(panelWeek());
  const lines=firstLines(txt,6);
  if(lines[0] && lines[0].length<140) w.vida.title=lines[0];
  if(lines[1] && lines[1].length<140 && !/minutos/i.test(lines[1])) w.vida.subtitle=lines[1];
  const dur=lines.find(l=>/minutos/i.test(l)); if(dur) w.vida.duration=dur.match(/\d+\s*minutos?/i)?.[0]||dur;
  const paras=splitParagraphs(txt);
  // Si hay apartados conocidos, dividir por ellos
  const heads=["Iniciar conversación","Hacer discípulos","Explicar sus creencias","Necesidades locales","Estudio bíblico","Discurso"];
  let sections=[];
  paras.forEach(pa=>{
    const head=heads.find(h=>pa.toLowerCase().includes(h.toLowerCase()));
    sections.push({label:head||"",text:pa});
  });
  if(sections.length) w.vida.sections=sections;
  panelLoadWeek();
  panelStatus("Vida separada en "+sections.length+" parte(s). Revisa etiquetas.");
}
function parseEstudioPaste(txt){
  const w=panelEnsureWeekShape(panelWeek());
  const lines=firstLines(txt,6);
  if(lines[0] && lines[0].length<140) w.estudio.chapter=lines[0];
  if(lines[1] && /capítulo|tema|adoración/i.test(lines[1])) w.estudio.chapter=lines[1];
  // Preguntas: buscar patrones "1." "Pregunta" "¿"
  const items=[];
  // Dividir por números de pregunta o por "Pregunta"
  const qSplit=txt.split(/(?:\n\s*(?:Pregunta\s*)?\d+\s*[.)]\s*|\n\s*Pregunta\s+\d+\s*[:.]\s*)/i).map(x=>x.trim()).filter(Boolean);
  if(qSplit.length>1){
    qSplit.forEach((chunk,i)=>{
      const qMatch=chunk.match(/^([^\n?]{5,200}\?)/);
      let q=qMatch?qMatch[1].trim():"";
      let rest=q?chunk.slice(q.length).trim():chunk;
      // Extra: "Investigue un poco más:"
      let extra="";
      const exMatch=rest.match(/investigue un poco más\s*:\s*([\s\S]*?)(?:\n|$)/i);
      if(exMatch){ extra=exMatch[1].trim(); rest=rest.replace(exMatch[0],"").trim(); }
      items.push({n:i+1,q:q,a:rest,extra:extra});
    });
  } else {
    items.push({n:1,q:"",a:txt,extra:""});
  }
  w.estudio.items=items;
  panelLoadWeek();
  panelStatus("Estudio separado en "+items.length+" pregunta(s). Revisa.");
}
function parseDiscursoPaste(txt){
  const w=panelEnsureWeekShape(panelWeek());
  const lines=firstLines(txt,6);
  if(lines[0] && lines[0].length<160) w.discurso.title=lines[0];
  const numLine=lines.find(l=>/n\.?°?\s*\d+|conferencia pública/i.test(l));
  if(numLine){ const m=numLine.match(/\d+/); if(m) w.discurso.number=m[0]; }
  const dur=lines.find(l=>/minutos/i.test(l)); if(dur) w.discurso.duration=dur.match(/\d+\s*minutos?/i)?.[0]||dur;
  const refLine=lines.find(l=>/(Salmo|Mateo|Juan|Hechos|Romanos|1 |2 |Isaías|Daniel)\s+\d+/i.test(l));
  if(refLine) w.discurso.textRef=refLine;
  w.discurso.note=txt;
  panelLoadWeek();
  panelStatus("Discurso separado. Revisa título y nota.");
}
function parseAtalayaPaste(txt){
  const w=panelEnsureWeekShape(panelWeek());
  const lines=firstLines(txt,6);
  if(lines[0] && lines[0].length<140) w.atalaya.title=lines[0];
  const dateLine=lines.find(l=>/de\s+\d{4}|enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre/i.test(l));
  if(dateLine) w.atalaya.dateLabel=dateLine;
  const themeLine=lines.find(l=>/«.*»|\(.*\d+:\d+.*\)/);
  if(themeLine) w.atalaya.themeText=themeLine;
  // Párrafos numerados
  const paras=[];
  const pSplit=txt.split(/\n\s*(?=\d+\s*[.)])/).map(x=>x.trim()).filter(Boolean);
  const chunks = pSplit.length>1 ? pSplit : splitParagraphs(txt);
  chunks.forEach((chunk,i)=>{
    const numMatch=chunk.match(/^(\d+)\s*[.)]\s*/);
    const num=numMatch?parseInt(numMatch[1],10):(i+1);
    let body=numMatch?chunk.slice(numMatch[0].length):chunk;
    // Pregunta: primera oración con ?
    const qMatch=body.match(/^([^\n]{5,220}\?)/);
    let q=qMatch?qMatch[1].trim():"";
    let rest=q?body.slice(q.length).trim():body;
    let extraQ="", extraA="";
    const exMatch=rest.match(/pregunta adicional\s*:\s*([^\n]+\?)\s*([\s\S]*)$/i);
    if(exMatch){ extraQ=exMatch[1].trim(); extraA=exMatch[2].trim(); rest=rest.slice(0,exMatch.index).trim(); }
    paras.push({num:num,q:q,a:rest,extraQ:extraQ,extraA:extraA});
  });
  if(paras.length) w.atalaya.paragraphs=paras;
  panelLoadWeek();
  panelStatus("Atalaya separada en "+paras.length+" párrafo(s) con pregunta/respuesta. Revisa adicionales.");
}
function parseDiarioPaste(txt){
  const d=(DATA.daily||[])[panelDailyIdx]||{};
  const lines=firstLines(txt,8);
  // Fecha
  const dateMatch=txt.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(dateMatch) d.date=dateMatch[0];
  const refMatch=txt.match(/((?:1 |2 |3 )?(?:Génesis|Éxodo|Salmo|Proverbios|Isaías|Mateo|Marcos|Lucas|Juan|Hechos|Romanos|1 Corintios|2 Corintios|Gálatas|Efesios|Filipenses|Colosenses|1 Tesalonicenses|2 Tesalonicenses|1 Timoteo|2 Timoteo|Tito|Hebreos|Santiago|1 Pedro|2 Pedro|1 Juan|Judas|Apocalipsis|Josué|Jueces|Rut|Job|Ezequiel|Daniel|Oseas|Joel|Amós|Jonás|Miqueas|Nahúm|Habacuc|Sofonías|Hageo|Zacarías|Malaquías|Levítico|Números|Deuteronomio|1 Samuel|2 Samuel|1 Reyes|2 Reyes|1 Crónicas|2 Crónicas|Esdras|Nehemías|Ester|Eclesiastés|Cantares|Jeremías|Lamentaciones|Abdías)\s+\d+:\d+(?:[-–]\d+)?)/);
  if(refMatch) d.ref=refMatch[1];
  // Campos por etiquetas
  function after(label){ const m=txt.match(new RegExp(label+"\\s*:\\s*([\\s\\S]*?)(?:\\n\\s*(?:Versículo|Comentario|Ejemplo|Lecciones|Referencia|Fecha|Enlace)\\s*:|$)","i")); return m?m[1].trim():""; }
  const verse=after("Versículo")||after("Texto");
  if(verse) d.verse=verse;
  const com=after("Comentario"); if(com) d.comment=com;
  const ex=after("Ejemplo"); if(ex) d.example=ex;
  const les=after("Lecciones"); if(les) d.lessons=les;
  if(!d.verse && lines.length>1) d.verse=lines[1];
  if(!d.comment && lines.length>2) d.comment=lines.slice(2).join("\n\n");
  if(!DATA.daily[panelDailyIdx]) DATA.daily[panelDailyIdx]=d;
  panelLoadDaily();
  panelStatus("Texto diario separado. Revisa fecha y referencia.");
}
function parseIlustracionPaste(txt){

function panelParseDatesFromText(txt){
  const w=panelWeek();
  if(!w) return false;
  let changed=false;
  const months={enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,octubre:10,noviembre:11,diciembre:12};
  // Rango: "30 de noviembre al 6 de diciembre de 2026" o "23 al 29 de noviembre de 2026"
  const rangeMatch=txt.match(/(\d{1,2})\s*(?:de\s+([a-záéíóú]+))?\s+al\s+(\d{1,2})\s+de\s+([a-záéíóú]+)\s+de\s+(\d{4})/i);
  if(rangeMatch){
    const year=parseInt(rangeMatch[5],10);
    const endMonth=months[rangeMatch[4].toLowerCase()]||1;
    const startMonth=rangeMatch[2]? (months[rangeMatch[2].toLowerCase()]||endMonth) : endMonth;
    const startDay=parseInt(rangeMatch[1],10), endDay=parseInt(rangeMatch[3],10);
    const pad=n=>String(n).padStart(2,"0");
    const startISO=year+"-"+pad(startMonth)+"-"+pad(startDay);
    const endISO=year+"-"+pad(endMonth)+"-"+pad(endDay);
    // Actualizar campos de semana si existen en DOM
    const rangeEl=$("#pw_range"), startEl=$("#pw_start"), endEl=$("#pw_end");
    if(rangeEl) rangeEl.value=rangeMatch[0];
    if(startEl) startEl.value=startISO;
    if(endEl) endEl.value=endISO;
    w.range=rangeMatch[0]; w.startDate=startISO; w.endDate=endISO;
    changed=true;
  } else {
    // Fecha suelta: "28 de noviembre de 2026" o "2026-11-28"
    const isoMatch=txt.match(/(\d{4})-(\d{2})-(\d{2})/);
    if(isoMatch){
      const dEl=$("#pdaily_date"); if(dEl && !dEl.value) dEl.value=isoMatch[0];
      changed=true;
    } else {
      const singleMatch=txt.match(/(\d{1,2})\s+de\s+([a-záéíóú]+)\s+de\s+(\d{4})/i);
      if(singleMatch){
        const day=parseInt(singleMatch[1],10), mon=months[singleMatch[2].toLowerCase()]||1, yr=parseInt(singleMatch[3],10);
        const pad=n=>String(n).padStart(2,"0");
        const iso=yr+"-"+pad(mon)+"-"+pad(day);
        const dEl=$("#pdaily_date"); if(dEl && !dEl.value) dEl.value=iso;
        // Si es Atalaya, poner como dateLabel
        const paEl=$("#pa_dateLabel"); if(paEl && !paEl.value) paEl.value=singleMatch[0];
        changed=true;
      }
    }
  }
  return changed;
}

function panelHandleImage(prefix){
  const fileEl=$("#pimg_file_"+prefix); const posEl=$("#pimg_pos_"+prefix); const statusEl=$("#pimg_status_"+prefix); const prevEl=$("#pimg_preview_"+prefix);

  if(file.size>2*1024*1024){ if(statusEl) statusEl.textContent="La imagen es muy grande (máx 2 MB)."; return; }
  const reader=new FileReader();
  reader.onload=()=>{
    const pos=posEl?posEl.value:"arriba";

  };
  reader.readAsDataURL(file);
}

function normTxt(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function snippetAround(text, q){
  const t = String(text||"").replace(/\s+/g," ").trim();
  if(!t) return "";
  const n = normTxt(t), nq = normTxt(q);
  const idx = n.indexOf(nq);
  if(idx===-1) return t.slice(0,160) + (t.length>160?"…":"");
  const start = Math.max(0, idx-60), end = Math.min(t.length, idx+q.length+100);
  return (start>0?"…":"") + t.slice(start,end) + (end<t.length?"…":"");
}
function buscarHTML(){
  return head("Buscar") +
    '<div class="searchbox"><input id="qInput" type="search" placeholder="Busca una palabra, referencia o tema…" autocomplete="off" enterkeyhint="search"></div>' +
    '<div id="qRes"><div class="empty">Escribe para buscar en textos diarios, semanas, ilustraciones y pensamientos.</div></div>';

function doSearch(q){
  const resEl = $("#qRes"); if(!resEl) return;
  const query = String(q||"").trim();
  if(query.length<2){ resEl.innerHTML = '<div class="empty">Escribe al menos 2 letras.</div>'; return; }
  const nq = normTxt(query);
  const out = [];
  const add = (cat,title,text,route) => {
    const hay = normTxt((title||"")+" "+(text||""));
    if(hay.includes(nq)) out.push({cat,title: title||cat, snip: snippetAround(text||title||"", query), route});
  };
  (DATA.daily||[]).forEach(d => add("Texto diario", d.label+" · "+d.ref, (d.verse||"")+" "+(d.comment||"")+" "+(d.example||"")+" "+(d.lessons||""), "#/texto/"+d.date));
  (WEEKS||[]).forEach((w,wi) => {
    if(!wkVisible(w)) return;
    if(w.tesoros) add("Tesoros de la Biblia", w.tesoros.title, (w.tesoros.objective||"")+" "+(w.tesoros.development||""), wkRoute("tesoros",wi));
    (w.perlas||[]).forEach(p => add("Perlas escondidas", p.ref, p.comment, wkRoute("perlas",wi)));
    if(w.vida) add("Nuestra vida cristiana", w.vida.title, (w.vida.sections||[]).map(s=>s.text).join(" "), wkRoute("vida",wi));
    if(w.estudio) (w.estudio.items||[]).forEach(it => add("Estudio bíblico", w.estudio.chapter+" · Pregunta "+(it.n||""), (it.q||"")+" "+(it.a||""), wkRoute("estudio",wi)));
    if(w.atalaya) (w.atalaya.paragraphs||[]).forEach(p => add("Estudio de La Atalaya", w.atalaya.title+" · Párrafo "+p.num, (p.q||"")+" "+(p.a||""), wkRoute("atalaya",wi)));
  });
  (DATA.illustrations||[]).forEach((x,i) => add("Ilustraciones", (x.num?"N.º "+x.num+" — ":"")+x.title, (x.bibleText||"")+" "+(x.teaching||"")+" "+(x.example||"")+" "+(x.explanation||"")+" "+(x.application||""), "#/ilustracion/"+i));
  (DATA.pensamientos||[]).forEach(p => add("Pensamiento para meditar", p.tipo||"Pensamiento", (p.texto||"")+" "+(p.referencia||""), "#/pensamiento"));
  if(!out.length){ resEl.innerHTML = '<div class="empty">No se encontraron resultados para “'+esc(query)+'”.</div>'; return; }
  const show = out.slice(0,30);
  resEl.innerHTML = '<div class="meta" style="margin:0 0 10px">'+show.length+' resultado'+(show.length===1?'':'s')+(out.length>30?' de '+out.length:'')+'</div><div class="card">' +
    show.map(r => '<button class="row sres" data-go="'+esc(r.route)+'"><span><span class="k">'+esc(r.cat)+'</span><span class="t">'+esc(r.title)+'</span><span class="s">'+esc(r.snip)+'</span></span><span class="arr">›</span></button>').join("") + '</div>';
  resEl.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.go; }));
}

  else if (r === "ajustes" || r === "configuracion"){ html = ajustesHTML(); bind = () => {
      app.querySelectorAll("[data-accent]").forEach(b => b.addEventListener("click", () => {
        store.set("ar1_accent", b.dataset.accent); applyAccent(); render();
      }));
      app.querySelectorAll("[data-fontsize]").forEach(b => b.addEventListener("click", () => {
        store.set("ar1_fontsize", b.dataset.fontsize); applyFontSize(); render();
      }));
      const panelBtn = $("#panelBtn"); if(panelBtn) panelBtn.addEventListener("click", () => { location.hash = "#/panel"; });
      const expBtn = $("#expBtn");
      if(expBtn) expBtn.addEventListener("click", () => {
        const dump = {};
        try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.indexOf("ar1_")===0) dump[k]=localStorage.getItem(k); } }catch(e){}
        const blob = new Blob([JSON.stringify({app:"Ayudas para las Reuniones", exported:new Date().toISOString(), data:dump}, null, 2)], {type:"application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href=url; a.download="ayudas-respaldo.json"; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url), 1000);
        const ok = $("#datOk"); if(ok) ok.textContent = "Respaldo descargado.";
      });
      const impBtn = $("#impBtn"), impFile = $("#impFile");
      if(impBtn && impFile){
        impBtn.addEventListener("click", () => impFile.click());
        impFile.addEventListener("change", () => {
          const f = impFile.files && impFile.files[0]; if(!f) return;
          const rd = new FileReader();
          rd.onload = () => {
            try{
              const j = JSON.parse(rd.result);
              const dump = j.data || j;
              let n=0;
              Object.keys(dump).forEach(k => { if(k.indexOf("ar1_")===0){ localStorage.setItem(k, dump[k]); n++; } });
              const ok = $("#datOk"); if(ok) ok.textContent = "Datos restaurados ("+n+"). Recargando…";
              setTimeout(()=>location.reload(), 800);
            }catch(e){ const ok = $("#datOk"); if(ok) ok.textContent = "No se pudo importar ese archivo."; }
          };
          rd.readAsText(f);
        });
      }
    }; }
  else { html = homeHTML(); }
  app.innerHTML = html;
  $("#backBtn").style.display = (r === "") ? "none" : "";
  app.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.go; }));
  app.querySelectorAll("[data-pubaudio]").forEach(b => b.addEventListener("click", () => {
    const w2 = WEEKS[parseInt(b.dataset.wi, 10)];
    if (!w2) return;
    if (b.dataset.pubaudio === "atalaya") playPubAudio(w2.audioAtalaya, "La Atalaya — " + w2.range);
    else playPubAudio(w2.audioGuia, "Guía de actividades — " + w2.range);
  }));
  app.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => { homeTab = b.dataset.tab; store.set("ar1_tab", homeTab); render(); }));
  app.querySelectorAll("[data-news]").forEach(b => b.addEventListener("click", () => { newsAll = true; render(); }));
  if (bind) bind();
  paintAllBlocks(app);
  window.scrollTo(0, 0);
}
$("#backBtn").addEventListener("click", () => { if (history.length > 1) history.back(); else location.hash = "#/"; });
$("#ttlHome").addEventListener("click", () => { location.hash = "#/"; });
$("#favBtn").addEventListener("click", () => { location.hash = "#/favoritos"; });
$("#setBtn").addEventListener("click", () => { location.hash = "#/ajustes"; });
window.addEventListener("hashchange", render);
  const sb = $("#searchBtn"); if(sb) sb.addEventListener("click", () => { location.hash = "#/buscar"; });
applyAccent();
applyFontSize();
render();
</script>
