<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ayudas para las Reuniones</title>
<meta name="description" content="Prepara y consulta el contenido de las reuniones, el texto diario y las ilustraciones.">
<style>
:root{
  --accent:#7b2d8b; --accent-dark:#5e2170;
  --navy:#1b2a4a; --navy2:#24365e;
  --bg:#f2f3f7; --card:#ffffff; --ink:#1d2433;
  --muted:#66707f; --line:#e3e6ee;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16.5px;line-height:1.55}
header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--navy2),var(--navy));color:#fff;display:flex;align-items:center;gap:6px;padding:10px 12px;box-shadow:0 2px 8px rgba(10,20,40,.25)}
header .ttl{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;display:flex;align-items:center;gap:8px;cursor:pointer}
header .ttl .home-ic{color:#cfa6e8;font-size:20px}
header button.icobtn{background:transparent;border:0;color:#fff;font-size:21px;padding:6px 8px;cursor:pointer;border-radius:8px}
header button.icobtn:active{background:rgba(255,255,255,.15)}
main{max-width:720px;margin:0 auto;padding:14px 12px 90px}
.hero{background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;border-radius:16px;padding:18px 18px 16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(20,35,70,.18)}
.hero .k{color:#cfa6e8;font-weight:700;letter-spacing:.06em;font-size:13.5px;text-transform:uppercase}
.hero p{margin:6px 0 0;font-size:17px;color:#eef1f8}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 4px;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.tabs button .tic{font-size:21px}
.tabs button.on{border-color:var(--accent);color:var(--ink);background:#fbf7fd}
.tabs button.on .tic{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);padding:16px 14px;font-size:16.5px;font-weight:600;color:var(--ink);cursor:pointer}
.row:last-child{border-bottom:0}
.row .ric{width:38px;height:38px;border-radius:50%;background:#f1e9f6;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.row .arr{margin-left:auto;color:#9aa3b2;font-size:20px;font-weight:400}
.row small{display:block;font-weight:400;color:var(--muted);font-size:13.5px;margin-top:2px}
.thought{padding:16px}
.thought .k{color:var(--muted);font-weight:700;letter-spacing:.05em;font-size:13px;text-transform:uppercase}
.thought .q{font-size:18.5px;font-style:italic;margin:10px 0 8px}
img.cimg{display:block;width:100%;height:auto;border-radius:12px}
figure.cfig{margin:12px 0}
figure.cfig figcaption{font-size:13.5px;color:var(--muted);margin-top:6px}
.thought img.cimg{margin-bottom:12px}
.ilthumb{width:58px;height:58px;object-fit:cover;border-radius:10px;flex:none}
.tag{display:inline-block;background:#e8f0fe;color:#2b5aa6;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}
.foot{color:var(--muted);font-size:13.5px;text-align:center;margin:18px 0 4px}
h1.screen{font-size:23px;line-height:1.3;margin:2px 0 6px}
h2.sec{font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin:20px 0 6px}
h4.subh{font-size:15.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--navy);margin:16px 0 4px}
.chip{display:inline-block;background:#eef0f5;border-radius:999px;padding:3px 11px;font-size:13.5px;color:#45506b;margin:2px 4px 2px 0;font-weight:600}
.meta{margin:6px 0 4px}
.blk{margin:7px 0}
.qline{font-weight:700;margin:14px 0 4px}
.extrabox{background:#f7f3fa;border:1px solid #e6dcf0;border-radius:12px;padding:10px 12px;margin:10px 0}
.extrabox .k{font-weight:700;color:var(--accent-dark);font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.pearl{border-bottom:1px solid var(--line);padding:12px 2px}
.pearl:last-child{border-bottom:0}
.pearl .pref{font-weight:700;font-size:17px}
a.ref{color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px dotted var(--accent);cursor:pointer}
mark.hl{color:inherit;padding:0 .5px;border-radius:2px;cursor:pointer}
.screenbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.screenbar .sp{flex:1}
button.bmk{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14.5px;font-weight:600;cursor:pointer;color:var(--ink)}
button.bmk.on{border-color:var(--accent);color:var(--accent);background:#fbf7fd}
.notebox{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.notebox label{font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.notebox textarea{width:100%;border:0;resize:vertical;min-height:74px;font:inherit;font-size:15.5px;margin-top:6px;outline:none;background:transparent;color:var(--ink)}
.notebox .saved{font-size:12.5px;color:#8a94a6}
textarea.inp, input.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
button.primary{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer;width:100%}
button.primary:active{background:var(--accent-dark)}
.kv{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 14px;margin:10px 0}
.kvrow{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.kvrow:last-child{border-bottom:0}
.kvl{flex:none;width:118px;font-weight:700;color:var(--accent-dark);font-size:13.5px;text-transform:uppercase;letter-spacing:.03em;padding-top:2px}
.kvv{flex:1;font-weight:600}
.wabtn{display:block;text-align:center;background:#25d366;color:#fff;font-weight:700;font-size:16.5px;padding:14px 18px;border-radius:12px;text-decoration:none;margin-top:18px}
.wabtn:active{background:#1eb856}
.swatches{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;cursor:pointer;font-weight:600;font-size:14.5px;color:var(--ink)}
.swatch .dot{width:34px;height:34px;border-radius:50%}
.swatch.on{border-color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
#sheetWrap{position:fixed;inset:0;z-index:60;display:none}
#sheetWrap.open{display:block}
#sheetBg{position:absolute;inset:0;background:rgba(10,16,30,.5)}
#sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:18px 18px 26px;max-height:72vh;overflow:auto;max-width:720px;margin:0 auto;box-shadow:0 -6px 30px rgba(0,0,0,.25)}
#sheet .sref{font-weight:800;font-size:18px;color:var(--navy);padding-right:34px}
#sheet .stext{margin-top:8px;font-size:17px}
#sheet .close{position:absolute;top:10px;right:12px;background:#eef0f5;border:0;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}
#sheet a.wol{display:inline-block;margin-top:12px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:11px 16px;border-radius:10px}
#hlbar{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 7px;display:none;align-items:center;gap:3px;box-shadow:0 4px 16px rgba(20,30,60,.18);min-height:40px;box-sizing:border-box}
#hlbar.open{display:flex}
#hlbar .cdot{width:27px;height:27px;border-radius:50%;border:1px solid rgba(20,30,60,.20);cursor:pointer;padding:0;flex:none}
.hlcbtn{position:relative;width:44px;height:30px;background:transparent;border:0;cursor:pointer;padding:0;flex:none;border-radius:999px}
.hlcbtn .ovl{position:absolute;top:50%;width:19px;height:19px;border-radius:50%;transform:translateY(-50%)}
.hlcbtn .ovl.b1{left:0}
.hlcbtn .ovl.b2{right:0}
.hlcbtn .ovl.fr{left:50%;width:23px;height:23px;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 1px 4px rgba(20,30,60,.28)}
.hlico{width:34px;height:30px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;color:var(--ink);cursor:pointer;padding:0;flex:none;border-radius:999px;font-size:15px}
.hlico:active{background:#f1e9f6}
::selection{background:rgba(120,120,140,.25)}
::-moz-selection{background:rgba(120,120,140,.25)}
</style>
</head>
<body>
<header>
  <button class="icobtn" id="backBtn" aria-label="Atrás" style="display:none">←</button>
  <div class="ttl" id="ttlHome"><span class="home-ic">⌂</span><span>Ayudas para las Reuniones</span></div>
  <button class="icobtn" id="favBtn" aria-label="Favoritos" title="Favoritos">🔖</button>
  <button class="icobtn" id="setBtn" aria-label="Ajustes" title="Ajustes">⚙️</button>
</header>
<main id="app"></main>

<div id="sheetWrap">
  <div id="sheetBg"></div>
  <div id="sheet">
    <button class="close" id="sheetClose" aria-label="Cerrar">✕</button>
    <div class="sref" id="sheetRef"></div>
    <div class="stext" id="sheetText"></div>
    <div id="sheetLink"></div>
  </div>
</div>

<div id="hlbar"></div>

<script src="data.js"></script>
<script>
"use strict";
/* ================= Configuración ================= */
const SUPPORT_WHATSAPP_LINK = "https://wa.me/527224248895"; // Enlace de WhatsApp para «Apoyo voluntario» (déjalo vacío para ocultar el botón de contacto).
const THOUGHTS = [
  {text:"La verdadera fortaleza no consiste en nunca caer, sino en encontrar el valor para levantarse cada vez", tag:"Reflexión", image:"img/pensamiento.jpg"}
];
/* ================= Utilidades ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const ACCENTS = {
  purpura:{name:"Púrpura", a:"#7b2d8b", d:"#5e2170"},
  azul:{name:"Azul", a:"#2471a3", d:"#1a5276"},
  verde:{name:"Verde", a:"#1e8449", d:"#145a32"},
  rojo:{name:"Rojo", a:"#c0392b", d:"#922b21"}
};
function applyAccent(){
  const key = store.get("ar1_accent","purpura");
  const ac = ACCENTS[key] || ACCENTS.purpura;
  document.documentElement.style.setProperty("--accent", ac.a);
  document.documentElement.style.setProperty("--accent-dark", ac.d);
}

/* ================= Versículos: detección y ventana flotante ================= */
const BOOKMAP = {
  "Génesis":["Génesis","Gén."],"Éxodo":["Éxodo","Éx."],"Levítico":["Levítico","Lev."],
  "Números":["Números","Núm."],"Deuteronomio":["Deuteronomio","Deut."],"Josué":["Josué","Jos."],
  "Jueces":["Jueces","Jue."],"Rut":["Rut"],
  "1 Samuel":["1 Samuel","1 Sam."],"2 Samuel":["2 Samuel","2 Sam."],
  "1 Reyes":["1 Reyes","1 Rey."],"2 Reyes":["2 Reyes","2 Rey."],
  "1 Crónicas":["1 Crónicas","1 Crón."],"2 Crónicas":["2 Crónicas","2 Crón."],
  "Esdras":["Esdras","Esd."],"Nehemías":["Nehemías","Neh."],"Ester":["Ester"],
  "Job":["Job"],"Salmo":["Salmos","Salmo","Sal."],"Proverbios":["Proverbios","Prov."],
  "Eclesiastés":["Eclesiastés","Ecl."],"Cantares":["Cantares","Cant."],
  "Isaías":["Isaías","Isa."],"Jeremías":["Jeremías","Jer."],"Lamentaciones":["Lamentaciones","Lam."],
  "Ezequiel":["Ezequiel","Ezeq."],"Daniel":["Daniel","Dan."],
  "Oseas":["Oseas"],"Joel":["Joel"],"Amós":["Amós"],"Abdías":["Abdías"],"Jonás":["Jonás"],
  "Miqueas":["Miqueas","Miq."],"Nahúm":["Nahúm"],"Habacuc":["Habacuc"],"Sofonías":["Sofonías"],
  "Ageo":["Ageo"],"Zacarías":["Zacarías","Zac."],"Malaquías":["Malaquías","Mal."],
  "Mateo":["Mateo","Mat."],"Marcos":["Marcos","Mar."],"Lucas":["Lucas","Luc."],
  "Juan":["Juan"],"Hechos":["Hechos","Hech."],"Romanos":["Romanos","Rom."],
  "1 Corintios":["1 Corintios","1 Cor."],"2 Corintios":["2 Corintios","2 Cor."],
  "Gálatas":["Gálatas","Gál."],"Efesios":["Efesios","Efes."],
  "Filipenses":["Filipenses","Filip."],"Colosenses":["Colosenses","Col."],
  "1 Tesalonicenses":["1 Tesalonicenses","1 Tes."],"2 Tesalonicenses":["2 Tesalonicenses","2 Tes."],
  "1 Timoteo":["1 Timoteo","1 Tim."],"2 Timoteo":["2 Timoteo","2 Tim."],
  "Tito":["Tito"],"Filemón":["Filemón"],"Hebreos":["Hebreos","Heb."],
  "Santiago":["Santiago","Sant."],"1 Pedro":["1 Pedro","1 Ped."],"2 Pedro":["2 Pedro","2 Ped."],
  "1 Juan":["1 Juan"],"2 Juan":["2 Juan"],"3 Juan":["3 Juan"],"Judas":["Judas"],
  "Apocalipsis":["Apocalipsis","Apoc."]
};
const REV = {}; const VARIANTS = [];
Object.keys(BOOKMAP).forEach(canon => BOOKMAP[canon].forEach(v => { REV[v.replace(/\.$/,"")] = canon; VARIANTS.push(v); }));
VARIANTS.sort((a,b) => b.length - a.length);
const REF_RE = new RegExp("(?<![A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9])(" + VARIANTS.map(v => v.replace(/\./g,"\\.")).join("|") + ")\\s+(\\d+):(\\d+)(?:\\s*[-–]\\s*(?:(\\d+):)?(\\d+)|\\s*,\\s*(\\d+))?", "g");
function canonRef(bookRaw, ch, v1, rngCh, rngV, listV){
  const canon = REV[bookRaw.replace(/\.$/,"")] || bookRaw;
  let r = canon + " " + ch + ":" + v1;
  if (rngV) r += "-" + (rngCh ? rngCh + ":" : "") + rngV;
  else if (listV) r += "," + listV;
  return r;
}
function linkify(escapedText){
  return escapedText.replace(REF_RE, (m, book, ch, v1, rngCh, rngV, listV) => {
    const canon = canonRef(book, ch, v1, rngCh, rngV, listV);
    return '<a class="ref" data-ref="' + esc(canon) + '" data-disp="' + esc(m) + '">' + m + "</a>";
  });
}
const VNORM = {};
Object.keys(DATA.verses).forEach(k => { VNORM[k.replace(/\s+/g," ").replace(/,\s*/g,",").trim()] = DATA.verses[k]; });
function verseLookup(canon){
  const n = canon.replace(/\s+/g," ").replace(/,\s*/g,",").trim();
  if (VNORM[n]) return VNORM[n];
  const m = n.match(/^(.+ \d+:\d+)[-,]/);
  if (m && VNORM[m[1]]) return VNORM[m[1]];
  return null;
}
function openVerse(canon, disp){
  $("#sheetRef").textContent = disp || canon;
  const txt = verseLookup(canon);
  if (txt){
    $("#sheetText").textContent = txt;
    $("#sheetLink").innerHTML = "";
  } else {
    $("#sheetText").textContent = "Este versículo todavía no está guardado en la app.";
    $("#sheetLink").innerHTML = '<a class="wol" target="_blank" rel="noopener" href="https://wol.jw.org/es/wol/l/r4/lp-s?q=' + encodeURIComponent(canon) + '">Ver en JW.org</a>';
  }
  $("#sheetWrap").classList.add("open");
}
function closeVerse(){ $("#sheetWrap").classList.remove("open"); }
$("#sheetBg").addEventListener("click", closeVerse);
$("#sheetClose").addEventListener("click", closeVerse);

/* ================= Bloques de texto y subrayado ================= */
const BLOCKTEXT = {};
const HL_COLORS = [
  ["amarillo","#ffe14d"],["verde","#97e05a"],["azul","#79c7f2"],["rosa","#f78fb3"],
  ["naranja","#ffb37c"],["morado","#b39df5"],["coral","#ff8a7a"],["cian","#5cd6dd"],["menta","#7fe3b0"]
];
let HL = store.get("ar1_highlights", {});
const HEADLINE_RE = /^[A-ZÁÉÍÓÚÑ¿?¡! ,;:()«»-]+$/;
function blocks(text, prefix){
  if (!text) return "";
  const out = []; let i = 0;
  String(text).split(/\n\n+/).forEach(chunk => {
    chunk.split(/\n/).forEach(line => {
      line = line.trim(); if (!line) return;
      const bid = prefix + ":" + (i++);
      BLOCKTEXT[bid] = line;
      const isHead = line.length > 3 && HEADLINE_RE.test(line) && /[A-ZÁÉÍÓÚÑ]/.test(line);
      out.push("<" + (isHead ? 'h4 class="subh blk"' : 'p class="blk"') + ' data-bid="' + bid + '">' + linkify(esc(line)) + (isHead ? "</h4>" : "</p>"));
    });
  });
  return out.join("");
}
function textNodes(el){
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const a = []; let n; while ((n = w.nextNode())) a.push(n); return a;
}
function wrapRange(el, s, e, color){
  let nodes = textNodes(el), pos = 0, startNode = null, startOff = 0, endNode = null, endOff = 0;
  for (const n of nodes){
    const len = n.nodeValue.length;
    if (startNode === null && s >= pos && s < pos + len){ startNode = n; startOff = s - pos; }
    if (e > pos && e <= pos + len){ endNode = n; endOff = e - pos; break; }
    pos += len;
  }
  if (!startNode || !endNode) return;
  if (endOff < endNode.nodeValue.length) endNode.splitText(endOff);
  if (startOff > 0) startNode = startNode.splitText(startOff);
  nodes = textNodes(el);
  let on = false;
  for (const n of nodes){
    if (n === startNode) on = true;
    if (on){
      const m = document.createElement("mark");
      m.className = "hl"; m.style.background = color; m.dataset.color = color;
      n.parentNode.replaceChild(m, n); m.appendChild(n);
    }
    if (n === endNode) break;
  }
}
function paintBlock(el){
  const bid = el.dataset.bid;
  if (BLOCKTEXT[bid] == null) return;
  el.innerHTML = linkify(esc(BLOCKTEXT[bid]));
  const list = (HL[bid] || []).slice().sort((a,b) => a.s - b.s);
  list.forEach(h => wrapRange(el, h.s, h.e, h.c));
}
function paintAllBlocks(root){
  (root || document).querySelectorAll(".blk").forEach(paintBlock);
}
/* Barra flotante de subrayado (§9), estilo JW Library: UNA sola píldora
   blanca junto a la selección, con dos estados. Estado compacto: botón de
   color con tres círculos solapados (el color actual delante y otros dos
   asomando detrás), papelera «Quitar» (solo al editar un subrayado ya
   puesto), botón «Copiar» y «✕». Al tocar el botón de color, la misma
   píldora pasa al estado paleta: los 9 colores en una fila de círculos sin
   nombres; tocar un color lo aplica y cierra la barra (también en modo
   edición, igual que hacía la barra anterior). Los subrayados se guardan
   por valor hex ({s, e, c} en ar1_highlights), así que renovar la paleta
   no altera el color de los subrayados ya guardados. */
let pendingSel = null;
let suppressedSel = null; // selección cerrada con ✕: no reabrir la barra para ella
let lastColor = HL_COLORS[0][1];
let barMode = "new", barRect = null;
const ICON_TRASH = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9.5 7V4.8A.8.8 0 0 1 10.3 4h3.4a.8.8 0 0 1 .8.8V7"/><path d="M6.5 7l.9 12.2A1 1 0 0 0 8.4 20h7.2a1 1 0 0 0 1-.8L17.5 7"/><path d="M10 11v5.5M14 11v5.5"/></svg>';
const ICON_COPY = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11.5" height="11.5" rx="2"/><path d="M5.5 14.5h-1A1.5 1.5 0 0 1 3 13V5.5A1.5 1.5 0 0 1 4.5 4H12a1.5 1.5 0 0 1 1.5 1.5v1"/></svg>';
function hlDotsHTML(){
  return HL_COLORS.map(([name,hex]) =>
    '<button class="cdot" data-c="' + hex + '" style="background:' + hex + '" aria-label="' + name + '"></button>').join("");
}
function placeNear(el, cx, top){
  const w = el.offsetWidth || 0;
  let left = Math.round(cx - w / 2);
  left = Math.max(6, Math.min(left, window.innerWidth - w - 6));
  el.style.transform = "";
  el.style.left = left + "px";
  el.style.top = Math.round(top) + "px";
  el.style.bottom = "auto";
}
function placeBar(){
  const bar = $("#hlbar");
  if (barRect){
    const cx = barRect.left + barRect.width / 2;
    const bh = bar.offsetHeight || 40, m = 14;
    // Por defecto DEBAJO de la selección, con margen claro y sin solaparla
    // (el menú del sistema de Android aparece encima: así no chocan). Solo
    // si no cabe debajo se coloca encima, con el mismo margen.
    if (barRect.bottom + m + bh <= window.innerHeight - 4) placeNear(bar, cx, barRect.bottom + m);
    else if (barRect.top - m - bh >= 4) placeNear(bar, cx, barRect.top - m - bh);
    else placeNear(bar, cx, Math.max(4, Math.min(barRect.bottom + m, window.innerHeight - bh - 4)));
  } else {
    bar.style.left = "50%"; bar.style.transform = "translateX(-50%)"; bar.style.top = "auto"; bar.style.bottom = "64px";
  }
}
function frontColor(){
  if (barMode === "edit" && pendingSel){
    const hit = (HL[pendingSel.bid] || []).find(x => x.s === pendingSel.s && x.e === pendingSel.e);
    if (hit) return hit.c;
  }
  return lastColor;
}
function ovlBacks(front){
  let b1 = HL_COLORS[7][1], b2 = HL_COLORS[3][1]; // cian y rosa, como en la foto
  if (front === b1) b1 = HL_COLORS[0][1];
  if (front === b2) b2 = HL_COLORS[0][1];
  if (b1 === b2) b2 = HL_COLORS[1][1];
  return [b1, b2];
}
function renderBarCompact(){

    '<button class="hlico" id="hlCancel" aria-label="Cerrar">✕</button>';

  const rm = $("#hlRemove"); if (rm) rm.addEventListener("click", removeHighlight);

function fallbackCopy(txt){
  try{
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }catch(e){}
}
function copyPendingText(){
  if (!pendingSel) return;
  const txt = (BLOCKTEXT[pendingSel.bid] || "").substring(pendingSel.s, pendingSel.e);
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(() => hideBar(), () => { fallbackCopy(txt); hideBar(); });
  } else { fallbackCopy(txt); hideBar(); }
}
function hideBar(){ $("#hlbar").classList.remove("open"); pendingSel = null; }
function cancelBar(){
  // Al cerrar con ✕: recuerda la selección y quítala, para que el chequeo
  // pendiente (mouseup/selectionchange) no vuelva a mostrar la barra al
  // soltar el clic con el texto aún seleccionado.
  if (pendingSel) suppressedSel = pendingSel;
  const sel = window.getSelection(); if (sel) sel.removeAllRanges();
  hideBar();
}
function saveHL(){ store.set("ar1_highlights", HL); }
function applyColor(c){
  if (!pendingSel) return;
  const {bid, s, e} = pendingSel;
  const list = (HL[bid] || []).filter(h => e <= h.s || s >= h.e);
  list.push({s, e, c}); list.sort((a,b) => a.s - b.s);
  HL[bid] = list; saveHL();
  const el = document.querySelector('.blk[data-bid="' + bid + '"]');
  if (el) paintBlock(el);
  const sel = window.getSelection(); if (sel) sel.removeAllRanges();
  hideBar();
}
function removeHighlight(){
  if (!pendingSel) return;
  const {bid, s, e} = pendingSel;
  HL[bid] = (HL[bid] || []).filter(h => !(h.s === s && h.e === e));
  if (!HL[bid].length) delete HL[bid];
  saveHL();
  const el = document.querySelector('.blk[data-bid="' + bid + '"]');
  if (el) paintBlock(el);
  hideBar();
}
function closestBlk(node){
  let el = node && node.nodeType === 3 ? node.parentElement : node;
  return el && el.closest ? el.closest(".blk") : null;
}
function checkSelection(){
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) return;
  const range = sel.getRangeAt(0);
  const b1 = closestBlk(range.startContainer), b2 = closestBlk(range.endContainer);
  if (!b1 || b1 !== b2) return;
  const pre = range.cloneRange();
  pre.selectNodeContents(b1);
  pre.setEnd(range.startContainer, range.startOffset);
  const s = pre.toString().length, e = s + range.toString().length;
  if (e > s){
    if (suppressedSel){
      const sup = suppressedSel; suppressedSel = null;
      if (sup.bid === b1.dataset.bid && sup.s === s && sup.e === e) return; // misma selección cerrada con ✕
    }
    pendingSel = {bid: b1.dataset.bid, s, e}; showBar("new", range.getBoundingClientRect());
  }
}
let selTimer = null;
// La píldora se muestra solo cuando la selección ya está quieta: cualquier
// evento (selectionchange, mouseup, touchend) reinicia la misma espera, así
// no aparece mientras el usuario aún arrastra los tiradores de selección.
function scheduleCheck(){ clearTimeout(selTimer); selTimer = setTimeout(checkSelection, 260); }
document.addEventListener("selectionchange", scheduleCheck);
document.addEventListener("mouseup", scheduleCheck);
document.addEventListener("touchend", scheduleCheck);
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest && t.closest("#hlbar")) return;
  const mark = t.closest ? t.closest("mark.hl") : null;
  if (mark){
    e.preventDefault();
    const blk = mark.closest(".blk"); if (!blk) return;
    const pre = document.createRange();
    pre.selectNodeContents(blk); pre.setEndBefore(mark);
    const s = pre.toString().length;
    pendingSel = {bid: blk.dataset.bid, s, e: s + mark.textContent.length};
    showBar("edit", mark.getBoundingClientRect());
    return;
  }
  const a = t.closest ? t.closest("a.ref") : null;
  if (a){ e.preventDefault(); openVerse(a.dataset.ref, a.dataset.disp); return; }
  hideBar();
});

    noteBox(id);
}
function textosHTML(){
  const rows = DATA.daily.map(d =>
    '<button class="row" data-go="#/texto/' + d.date + '"><span class="ric">📖</span><span>' +
    esc(d.label) + "<small>" + esc(d.weekday) + " · " + esc(d.ref) + '</small></span><span class="arr">›</span></button>').join("");
  return head("Texto diario", chips(["41 textos"])) + '<div class="card">' + rows + "</div>";
}
function textoHTML(d){
  const id = "texto-" + d.date;
  const imgs = d.images || [];
  let mainImg = "", extraImgs = "";
  if (imgs.length){
    mainImg = imgHTML(imgs[0], d.ref);
    if (imgs.length > 1 && d.example) extraImgs = imgs.slice(1).map(s => imgHTML(s, d.ref)).join("");
    else if (imgs.length > 1) mainImg += imgs.slice(1).map(s => imgHTML(s, d.ref)).join("");
  }
  let h = screenBar(id, "Texto diario — " + d.label, "#/texto/" + d.date) +
    head(d.label, chips([d.weekday])) +
    blocks(d.verse, id + "-verse") +
    '<div class="pref" style="font-weight:700;font-size:19px">' + linkify(esc(d.ref)) + "</div>" +
    mainImg +
    "<h2 class=\"sec\">COMENTARIO</h2>" + blocks(d.comment, id + "-comment");
  if (d.example) h += "<h2 class=\"sec\">EJEMPLO</h2>" + extraImgs + blocks(d.example, id + "-example");
  h += "<h2 class=\"sec\">LECCIONES PRÁCTICAS</h2>" + blocks(d.lessons, id + "-lessons");
  return h + noteBox(id);
}
function ilustracionesHTML(){
  const rows = DATA.illustrations.map((x,i) =>
    '<button class="row" data-go="#/ilustracion/' + i + '">' +
    (x.images && x.images.length ? '<img class="ilthumb" src="' + esc(x.images[0]) + '" alt="" loading="lazy">' : '<span class="ric">🖼️</span>') +
    '<span>' +
    esc((x.num ? "N.º " + x.num + " — " : "") + x.title) + "<small>" + esc(x.bibleText || "Ilustración") + '</small></span><span class="arr">›</span></button>').join("");
  return head("Ilustraciones", chips(["14 ilustraciones"])) + '<div class="card">' + rows + "</div>";
}
function ilustracionHTML(x, i){
  const id = "ilus-" + i;
  const field = (label, text, key) => text ? "<h2 class=\"sec\">" + label + "</h2>" + blocks(text, id + "-" + key) : "";
  const fullTitle = (x.num ? "N.º " + x.num + " — " : "") + x.title;
  return screenBar(id, "Ilustración — " + x.title, "#/ilustracion/" + i) +
    head(fullTitle) +
    "<h2 class=\"sec\">TÍTULO</h2>" + blocks(fullTitle.toUpperCase(), id + "-tit") +
    (x.images ? x.images.map(s => imgHTML(s, x.title)).join("") : "") +
    field("EJEMPLO", x.example, "eje") +
    field("EXPLICACIÓN", x.explanation, "exp") +
    field("ENSEÑANZA", x.teaching, "ens") +
    field("APLICACIÓN", x.application, "apl") +
    field("Texto bíblico", x.bibleText, "bib") +
    noteBox(id);
}
function sugerenciasHTML(){
  const sugs = store.get("ar1_sugs", []);
  const list = sugs.length ? "<h2 class=\"sec\">Tus sugerencias guardadas</h2>" + sugs.map(s =>
    '<div class="extrabox">' + blocks(s.text, "sug-" + s.when) + "</div>").join("") : "";
  return head("Sugerencias") +
    "<p>¿Tienes una sugerencia para mejorar la app? Escríbela aquí; se guardará en este dispositivo.</p>" +
    '<textarea class="inp" id="sugTa" rows="4" placeholder="Escribe tu sugerencia…"></textarea>' +
    '<div style="height:10px"></div><button class="primary" id="sugBtn">Guardar sugerencia</button>' +
    '<p id="sugOk" style="color:var(--accent);font-weight:700"></p>' + list;
}
function favoritosHTML(){
  if (!FAVS.length) return head("Favoritos") + '<div class="empty">Todavía no tienes favoritos.<br>Toca «Guardar» en cualquier pantalla para agregarla aquí.</div>';
  const rows = FAVS.map(f =>
    '<button class="row" data-go="' + esc(f.route) + '"><span class="ric">🔖</span><span>' + esc(f.title) + '</span><span class="arr">›</span></button>').join("");
  return head("Favoritos") + '<div class="card">' + rows + "</div>";
}
function ajustesHTML(){
  const cur = store.get("ar1_accent","purpura");
  const sw = Object.keys(ACCENTS).map(k =>
    '<button class="swatch' + (cur === k ? " on" : "") + '" data-accent="' + k + '"><span class="dot" style="background:' + ACCENTS[k].a + '"></span>' + ACCENTS[k].name + "</button>").join("");
  return head("Ajustes") +
    "<h2 class=\"sec\">Color principal</h2><div class=\"swatches\">" + sw + "</div>" +
    '<p style="color:var(--muted);font-size:14.5px;margin-top:18px">Tus favoritos, notas, subrayados y sugerencias se guardan solo en este dispositivo.</p>';
}
function pensamientoHTML(){
  const cards = THOUGHTS.map(t =>
    '<div class="card thought">' + (t.image ? imgHTML(t.image, "Un pensamiento para meditar") : "") +
    '<div class="q">«' + esc(t.text) + '».</div>' +
    (t.tag ? '<span class="tag">' + esc(t.tag) + "</span>" : "") + "</div>").join("");
  return head("Un pensamiento para meditar") + cards;
}
function apoyoHTML(){
  let h = head("Apoyo voluntario") +
    "<h2 class=\"sec\">Una aplicación gratuita</h2>" +
    blocks("«Ayudas para las Reuniones» es una aplicación gratuita, creada para ayudar a preparar y consultar el contenido de las reuniones. No tiene costo, suscripciones ni funciones de pago.", "apoyo-gratis") +
    "<h2 class=\"sec\">El apoyo es voluntario</h2>" +
    blocks("Quien desee apoyar voluntariamente el mantenimiento de la aplicación puede hacerlo poniéndose en contacto. El apoyo es completamente voluntario: la aplicación seguirá siendo gratuita para todos, se apoye o no.", "apoyo-vol") +
    "<h2 class=\"sec\">Privacidad</h2>" +
    blocks("Nota de privacidad: tus notas, subrayados, favoritos y sugerencias se guardan solo en este dispositivo y no se comparten con nadie.", "apoyo-priv");
  if (SUPPORT_WHATSAPP_LINK) h += '<a class="wabtn" href="' + esc(SUPPORT_WHATSAPP_LINK) + '" target="_blank" rel="noopener">💬 Contactar por WhatsApp</a>';
  return h;
}

/* ================= Enrutado ================= */
const app = $("#app");
function render(){
  hideBar(); closeVerse();
  imgSeq = 0;
  const h = location.hash || "#/";
  const parts = h.replace(/^#\/?/, "").split("/");
  const r = parts[0] || "";
  let html = "", bind = null;
  if (r === "" ) { html = homeHTML(); }
  else if (r === "tesoros"){ const wi = parseInt(parts[1], 10) || 0; html = tesorosHTML(wi); bind = () => bindScreen("tesoros" + wkSuffix(wi),"Tesoros de la Biblia",wkRoute("tesoros", wi)); }
  else if (r === "perlas"){ const wi = parseInt(parts[1], 10) || 0; html = perlasHTML(wi); bind = () => bindScreen("perlas","Busquemos perlas escondidas","#/perlas"); }
  else if (r === "vida"){ const wi = parseInt(parts[1], 10) || 0; html = vidaHTML(wi); bind = () => bindScreen("vida" + wkSuffix(wi),"Nuestra vida cristiana",wkRoute("vida", wi)); }
  else if (r === "estudio"){ const wi = parseInt(parts[1], 10) || 0; html = estudioHTML(wi); bind = () => bindScreen("estudio" + wkSuffix(wi),"Estudio bíblico de la congregación",wkRoute("estudio", wi)); }
  else if (r === "discurso"){ const wi = parseInt(parts[1], 10) || 0; html = discursoHTML(wi); bind = () => bindScreen("discurso" + wkSuffix(wi),"Discurso público",wkRoute("discurso", wi)); }
  else if (r === "atalaya"){ const wi = parseInt(parts[1], 10) || 0; html = atalayaHTML(wi); bind = () => bindScreen("atalaya" + wkSuffix(wi),"Estudio de La Atalaya",wkRoute("atalaya", wi)); }
  else if (r === "textos"){ html = textosHTML(); }
  else if (r === "texto"){ const d = DATA.daily.find(x => x.date === parts[1]); html = d ? textoHTML(d) : textosHTML(); if (d) bind = () => bindScreen("texto-" + d.date, "Texto diario — " + d.label, "#/texto/" + d.date); }
  else if (r === "ilustraciones"){ html = ilustracionesHTML(); }
  else if (r === "ilustracion"){ const i = parseInt(parts[1], 10); const x = DATA.illustrations[i]; html = x ? ilustracionHTML(x, i) : ilustracionesHTML(); if (x) bind = () => bindScreen("ilus-" + i, "Ilustración — " + x.title, "#/ilustracion/" + i); }
  else if (r === "sugerencias"){ html = sugerenciasHTML(); bind = () => {
      $("#sugBtn").addEventListener("click", () => {
        const ta = $("#sugTa"); const txt = ta.value.trim(); if (!txt) return;
        const sugs = store.get("ar1_sugs", []); sugs.push({text: txt, when: Date.now()});
        store.set("ar1_sugs", sugs); render();
        const ok = $("#sugOk"); if (ok) ok.textContent = "¡Gracias! Tu sugerencia quedó guardada.";
      });
    }; }
  else if (r === "pensamiento"){ html = pensamientoHTML(); }
  else if (r === "apoyo"){ html = apoyoHTML(); }
  else if (r === "favoritos"){ html = favoritosHTML(); }
  else if (r === "ajustes" || r === "configuracion"){ html = ajustesHTML(); bind = () => {
      app.querySelectorAll("[data-accent]").forEach(b => b.addEventListener("click", () => {
        store.set("ar1_accent", b.dataset.accent); applyAccent(); render();
      }));
    }; }
  else { html = homeHTML(); }
  app.innerHTML = html;
  $("#backBtn").style.display = (r === "") ? "none" : "";
  app.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.go; }));
  app.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => { homeTab = b.dataset.tab; store.set("ar1_tab", homeTab); render(); }));
  if (bind) bind();
  paintAllBlocks(app);
  window.scrollTo(0, 0);
}
$("#backBtn").addEventListener("click", () => { if (history.length > 1) history.back(); else location.hash = "#/"; });
$("#ttlHome").addEventListener("click", () => { location.hash = "#/"; });
$("#favBtn").addEventListener("click", () => { location.hash = "#/favoritos"; });
$("#setBtn").addEventListener("click", () => { location.hash = "#/ajustes"; });
window.addEventListener("hashchange", render);
applyAccent();
render();
</script>
</body>
</html>
